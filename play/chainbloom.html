<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B1F">
<title>CHAINBLOOM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%230E0B1F'/%3E%3Ccircle cx='36' cy='44' r='20' fill='%23FFB547'/%3E%3Ccircle cx='64' cy='44' r='20' fill='%23FFB547' fill-opacity='.85'/%3E%3Ccircle cx='40' cy='66' r='11' fill='%23FF86D6'/%3E%3Ccircle cx='60' cy='66' r='11' fill='%23FF86D6'/%3E%3Crect x='46.5' y='28' width='7' height='46' rx='3.5' fill='%230E0B1F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CHAINBLOOM — UI layer. Mothlamp palette: midnight ink, one warm lamp, neon only where something is alive. */
:root {
  --ink: #0E0B1F;
  --ink-2: #16112F;
  --ink-3: #221A45;
  --line: rgba(246, 231, 200, 0.14);
  --cream: #F6E7C8;
  --cream-dim: rgba(246, 231, 200, 0.62);
  --amber: #FFB547;
  --gold: #FFE45E;
  --coral: #FF5E6C;
  --cyan: #6FE6FF;
  --violet: #B98CFF;
  --green: #6EF29A;
  --pink: #FF86D6;
  --r: 18px;
  --font: "Fredoka", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ink); color: var(--cream);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}
canvas#game { position: fixed; inset: 0; display: block; cursor: crosshair; }
button { font-family: inherit; }

#ui, #hud { position: fixed; inset: 0; pointer-events: none; }
#ui > *, #hud > * { pointer-events: auto; }
#hud { z-index: 2; }
#ui { z-index: 3; }

/* ---------------------------------------------------------------- buttons */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: 600 18px/1 var(--font); letter-spacing: 0.02em;
  color: var(--ink); background: var(--amber);
  padding: 14px 26px; border-radius: 999px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) inset, 0 8px 30px rgba(255, 181, 71, 0.28);
  transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s;
}
.btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 0 12px 40px rgba(255, 181, 71, 0.45); }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn.ghost { background: rgba(246, 231, 200, 0.06); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; }
.btn.ghost:hover { background: rgba(246, 231, 200, 0.12); }
.btn.cyan { background: var(--cyan); box-shadow: 0 8px 30px rgba(111, 230, 255, 0.3); }
.btn.violet { background: var(--violet); box-shadow: 0 8px 30px rgba(185, 140, 255, 0.3); }
.btn.small { font-size: 15px; padding: 10px 18px; }
.btn[disabled], .btn.disabled { filter: grayscale(0.8) brightness(0.6); cursor: not-allowed; transform: none; }
.icon-btn {
  appearance: none; border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(14, 11, 31, 0.6); color: var(--cream); font-size: 18px;
  box-shadow: 0 0 0 1px var(--line) inset; backdrop-filter: blur(6px);
}
.icon-btn:hover { background: rgba(34, 26, 69, 0.9); }

/* ---------------------------------------------------------------- overlays */
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  animation: fadeIn 0.35s ease both;
}
.overlay.dim { background: rgba(7, 5, 16, 0.6); backdrop-filter: blur(3px); }
.overlay.scroll { align-items: flex-start; overflow-y: auto; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

.panel {
  width: min(560px, 100%);
  background: linear-gradient(180deg, rgba(34, 26, 69, 0.92), rgba(14, 11, 31, 0.96));
  border-radius: 28px; padding: 28px;
  box-shadow: 0 0 0 1px var(--line) inset, 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: rise 0.4s cubic-bezier(.2, .9, .3, 1.2) both;
}
.panel.wide { width: min(980px, 100%); }
.panel h2 { margin: 0 0 6px; font-size: 30px; font-weight: 700; }
.panel .sub { color: var(--cream-dim); margin: 0 0 18px; font-size: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.eyebrow { font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cream-dim); font-weight: 600; }

/* ---------------------------------------------------------------- splash + title */
.splash { flex-direction: column; gap: 14px; background: var(--ink); cursor: pointer; }
.splash svg { width: 92px; height: 92px; animation: pop 0.9s cubic-bezier(.2, .9, .3, 1.3) both; filter: drop-shadow(0 0 24px rgba(255, 181, 71, 0.55)); }
.splash .studio { font-size: 22px; letter-spacing: 0.4em; font-weight: 600; text-transform: lowercase; animation: rise 0.8s 0.3s both; }
.splash .tag { color: var(--cream-dim); font-size: 14px; letter-spacing: 0.1em; animation: rise 0.8s 0.5s both; }

.title { flex-direction: column; gap: 10px; text-align: center; background: radial-gradient(ellipse at center, rgba(14,11,31,0.15), rgba(14,11,31,0.75) 70%); }
.logo {
  font-weight: 700; font-size: clamp(48px, 12vw, 128px); line-height: 0.9; letter-spacing: 0.02em; margin: 0;
  background: linear-gradient(100deg, #FFE45E 0%, #FFB547 22%, #FF5E6C 42%, #FF86D6 58%, #B98CFF 74%, #6FE6FF 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 28px rgba(255, 140, 90, 0.45));
  animation: shimmer 6s ease-in-out infinite alternate, pop 0.8s cubic-bezier(.2, .9, .3, 1.3) both;
}
@keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
.tagline { font-size: clamp(16px, 3.6vw, 24px); color: var(--cream); margin: 4px 0 26px; font-weight: 500; animation: rise 0.7s 0.2s both; }
.menu { display: flex; flex-direction: column; gap: 12px; align-items: center; width: min(320px, 90vw); animation: rise 0.7s 0.35s both; }
.menu .btn { width: 100%; }
.menu .daily small { display: block; font-size: 12px; font-weight: 500; opacity: 0.75; margin-top: 4px; letter-spacing: 0.05em; }
.title .foot { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; color: var(--cream-dim); font-size: 13px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 0 16px; }
.title .studio-mark { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 20px; display: flex; gap: 8px; align-items: center; font-size: 14px; letter-spacing: 0.25em; color: var(--cream-dim); }
.title .studio-mark svg { width: 26px; height: 26px; }

/* ---------------------------------------------------------------- jars */
.jars { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin: 10px 0 20px; }
.jar {
  position: relative; border-radius: var(--r); padding: 16px; cursor: pointer; text-align: left;
  background: rgba(246, 231, 200, 0.04); box-shadow: 0 0 0 1px var(--line) inset;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s; color: var(--cream); border: 0; font-family: inherit;
}
.jar:hover { transform: translateY(-3px); background: rgba(246, 231, 200, 0.08); }
.jar.sel { box-shadow: 0 0 0 2px var(--c) inset, 0 0 30px color-mix(in srgb, var(--c) 35%, transparent); }
.jar .swatch { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--c) 40%, transparent 72%); box-shadow: 0 0 22px var(--c); margin-bottom: 10px; }
.jar b { display: block; font-size: 17px; margin-bottom: 4px; }
.jar span { font-size: 13px; color: var(--cream-dim); line-height: 1.35; display: block; }
.jar.locked { cursor: not-allowed; opacity: 0.55; }
.jar.locked .swatch { background: rgba(246, 231, 200, 0.12); box-shadow: none; }

/* ---------------------------------------------------------------- HUD (DOM bits) */
.hud-top-right { position: absolute; right: 12px; top: auto; }
.pause-btn { position: absolute; right: 14px; bottom: calc(var(--botH, 70px) * 0.5 - 17px); }
.cat-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--botH, 70px) * 0.5 - 18px); display: flex; gap: 6px; }
.cat-chip {
  width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; position: relative;
  background: rgba(22, 17, 47, 0.85); box-shadow: 0 0 0 1px var(--rc, var(--line)) inset; cursor: help;
}
.cat-chip.empty { opacity: 0.25; font-size: 14px; }
.cat-chip .tip {
  position: absolute; bottom: 54px; left: 50%; margin-left: -110px; width: 220px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.35;
  background: rgba(14, 11, 31, 0.97); box-shadow: 0 0 0 1px var(--line) inset, 0 10px 30px rgba(0,0,0,0.5);
  opacity: 0; transform: translateY(6px); pointer-events: none; transition: 0.15s; text-align: left;
}
.cat-chip:hover .tip, .cat-chip.show .tip { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; font-size: 15px; }
.tip em { font-style: normal; color: var(--gold); display: block; margin-top: 4px; font-size: 13px; }
.bank-btn { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--botH, 70px) + 6px); animation: rise 0.3s both; }
.hint {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--botH, 70px) + 64px);
  background: rgba(14, 11, 31, 0.88); padding: 12px 18px; border-radius: 16px; font-size: 16px; text-align: center; max-width: min(420px, 90vw);
  box-shadow: 0 0 0 1px rgba(255, 181, 71, 0.4) inset, 0 0 30px rgba(255, 181, 71, 0.15); pointer-events: none !important;
  animation: rise 0.4s both;
}
.round-intro {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none !important;
  animation: introIn 2.1s ease both;
}
.round-intro .eyebrow { font-size: 14px; }
.round-intro h3 { margin: 6px 0; font-size: clamp(34px, 7vw, 60px); font-weight: 700; text-shadow: 0 0 30px rgba(255, 181, 71, 0.6); }
.round-intro .boss { color: var(--violet); text-shadow: 0 0 30px rgba(185, 140, 255, 0.7); }
.round-intro p { margin: 0; font-size: 18px; color: var(--cream); }
.round-intro .target { color: var(--gold); font-weight: 700; }
@keyframes introIn { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.9); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -56%); } }

.toasts { position: absolute; top: calc(var(--topH, 110px) + 8px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none !important; }
.toast { background: rgba(14, 11, 31, 0.92); padding: 10px 16px; border-radius: 14px; font-size: 15px; box-shadow: 0 0 0 1px var(--line) inset; animation: toast 3.4s ease both; white-space: nowrap; }
.toast b { color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------------------------------------------------------------- result */
.result h2.win { color: var(--gold); text-shadow: 0 0 30px rgba(255, 228, 94, 0.45); }
.result h2.lose { color: var(--coral); }
.big-score { font-size: clamp(44px, 10vw, 72px); font-weight: 700; line-height: 1; margin: 8px 0 2px; text-shadow: 0 0 30px rgba(255, 181, 71, 0.5); }
.vs { color: var(--cream-dim); font-size: 16px; margin-bottom: 14px; }
.formula { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 12px 0 18px; font-weight: 700; font-size: 20px; }
.formula .g { color: var(--amber); } .formula .m { color: var(--cyan); }
.formula .chip { padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,0.05); box-shadow: 0 0 0 1px var(--line) inset; }
.stats-row { display: flex; justify-content: center; gap: 22px; margin: 6px 0 18px; color: var(--cream-dim); font-size: 14px; flex-wrap: wrap; }
.stats-row b { display: block; color: var(--cream); font-size: 22px; }
.earn { list-style: none; padding: 0; margin: 0 0 18px; }
.earn li { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px dashed var(--line); animation: rise 0.35s both; font-size: 16px; }
.earn li span:last-child { color: var(--gold); font-weight: 700; }
.earn li.total { border: 0; font-size: 19px; font-weight: 700; }

/* ---------------------------------------------------------------- shop */
.shop .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.money { font-size: 34px; font-weight: 700; color: var(--gold); text-shadow: 0 0 20px rgba(255, 228, 94, 0.4); }
.next {
  border-radius: var(--r); padding: 12px 16px; background: rgba(246, 231, 200, 0.04); box-shadow: 0 0 0 1px var(--line) inset; min-width: 220px;
}
.next.boss { box-shadow: 0 0 0 1px rgba(185, 140, 255, 0.6) inset, 0 0 30px rgba(185, 140, 255, 0.15); }
.next b { font-size: 18px; } .next .t { color: var(--gold); font-weight: 700; } .next .rule { color: var(--violet); font-size: 14px; margin-top: 4px; }
.shelf-label { margin: 18px 0 10px; display: flex; justify-content: space-between; align-items: center; }
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card {
  position: relative; border-radius: var(--r); padding: 14px 14px 52px; min-height: 170px; cursor: pointer; text-align: left; border: 0; color: var(--cream); font-family: inherit;
  background: linear-gradient(180deg, rgba(246, 231, 200, 0.07), rgba(246, 231, 200, 0.02));
  box-shadow: 0 0 0 1px var(--rc, var(--line)) inset; transition: transform 0.15s, box-shadow 0.15s; animation: rise 0.35s both;
}
.card:hover { transform: translateY(-4px) rotate(-0.4deg); box-shadow: 0 0 0 2px var(--rc, var(--line)) inset, 0 14px 30px rgba(0,0,0,0.4), 0 0 26px color-mix(in srgb, var(--rc, #fff) 25%, transparent); }
.card .ic { font-size: 34px; line-height: 1; margin-bottom: 8px; display: block; filter: drop-shadow(0 0 10px rgba(255,255,255,0.25)); }
.card .nm { font-weight: 700; font-size: 17px; display: block; }
.card .rar { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rc, var(--cream-dim)); display: block; margin: 2px 0 6px; }
.card .tx { font-size: 14px; line-height: 1.35; color: var(--cream-dim); display: block; }
.card .tx strong { color: var(--cream); }
.card .price { position: absolute; left: 14px; bottom: 12px; font-weight: 700; color: var(--gold); font-size: 18px; }
.card .act { position: absolute; right: 12px; bottom: 10px; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--amber); color: var(--ink); font-weight: 700; }
.card.cant .act { background: rgba(246, 231, 200, 0.12); color: var(--cream-dim); }
.card.sold { opacity: 0.35; pointer-events: none; }
.card.sold .act { display: none; }
.card.r1 { --rc: rgba(246, 231, 200, 0.35); }
.card.r2 { --rc: #6FE6FF; }
.card.r3 { --rc: #FF86D6; background: linear-gradient(160deg, rgba(255, 134, 214, 0.12), rgba(185, 140, 255, 0.08) 50%, rgba(111, 230, 255, 0.1)); }
.card.pack { --rc: var(--mc); }
.card.star { --rc: #FFE45E; }
.mote-ic { width: 34px; height: 34px; margin-bottom: 8px; display: block; }
.owned { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.owned .slot { min-height: 74px; border-radius: 16px; box-shadow: 0 0 0 1px var(--line) inset; display: flex; align-items: center; gap: 10px; padding: 10px; position: relative; cursor: pointer; background: rgba(246,231,200,0.03); border: 0; color: var(--cream); font-family: inherit; text-align: left; }
.owned .slot.empty { justify-content: center; color: var(--cream-dim); font-size: 13px; cursor: default; }
.owned .slot .ic { font-size: 26px; }
.owned .slot .nm { font-size: 13px; font-weight: 600; line-height: 1.2; }
.owned .slot .sell { font-size: 11px; color: var(--coral); display: block; margin-top: 2px; }
.owned .slot .ctr { font-size: 11px; color: var(--gold); display: block; }
.jar-list { display: flex; flex-wrap: wrap; gap: 8px; }
.jar-pill { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(246, 231, 200, 0.05); box-shadow: 0 0 0 1px var(--line) inset; font-size: 14px; }
.jar-pill b { font-size: 16px; }
.jar-pill .lv { color: var(--gold); font-size: 12px; }
.jar-pill .d { color: var(--cream-dim); font-size: 12px; }
.shop .foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; position: sticky; bottom: -28px; padding: 14px 0 0; background: linear-gradient(0deg, rgba(14,11,31,1) 60%, rgba(14,11,31,0)); }

/* ---------------------------------------------------------------- game over / share */
.share-card { width: 100%; max-width: 300px; border-radius: 16px; display: block; margin: 0 auto 16px; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,0.5); }
.share-text { white-space: pre; font-size: 14px; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 12px; margin: 0 0 16px; text-align: left; overflow-x: auto; }

/* ---------------------------------------------------------------- book + settings */
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.book-grid .card { min-height: 130px; padding-bottom: 14px; cursor: default; }
.book-grid .card.unseen { filter: grayscale(1) brightness(0.5); }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs .btn { padding: 8px 16px; font-size: 15px; }
.setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); gap: 16px; }
.setting input[type=range] { width: 160px; accent-color: var(--amber); }
.toggle { width: 52px; height: 30px; border-radius: 999px; background: rgba(246,231,200,0.15); position: relative; cursor: pointer; border: 0; transition: 0.2s; }
.toggle::after { content: ''; position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--cream); top: 3px; left: 3px; transition: 0.2s; }
.toggle.on { background: var(--amber); }
.toggle.on::after { left: 25px; background: var(--ink); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.legend .item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(246,231,200,0.04); box-shadow: 0 0 0 1px var(--line) inset; font-size: 14px; }
.legend .item small { color: var(--cream-dim); display: block; }

@media (max-width: 640px) {
  .panel { padding: 20px 16px; border-radius: 22px; }
  .panel h2 { font-size: 24px; }
  .shelf { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .card .rar { letter-spacing: 0.06em; font-size: 10px; }
  .card .act { display: none; }
  .card { min-height: 150px; padding: 12px 12px 48px; }
  .card .ic { font-size: 28px; }
  .card .tx { font-size: 13px; }
  .owned { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .owned .slot { flex-direction: column; justify-content: center; gap: 2px; padding: 6px 2px; min-height: 64px; text-align: center; }
  .owned .slot .nm { font-size: 10px; }
  .cat-chip { width: 36px; height: 36px; font-size: 18px; border-radius: 11px; }
  .cat-bar { gap: 4px; }
  .pause-btn { right: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
}

</style>

<body>
<canvas id="game" aria-label="CHAINBLOOM play field"></canvas>
<div id="hud"></div>
<div id="ui"></div>
<script>
// ---- src/util.js
// CHAINBLOOM — shared utilities. Loaded first; everything hangs off the CB namespace.
// Works in the browser (window.CB) and in Node (tools/balance.js loads these files into a vm context).
var CB = (typeof window !== 'undefined') ? (window.CB = window.CB || {}) : (globalThis.CB = globalThis.CB || {});

(function (CB) {
  'use strict';

  // Small, fast, seedable PRNG (mulberry32). Every source of randomness in a run goes through one of these,
  // which is what makes Daily Bloom seeds and the balance simulator deterministic.
  function RNG(seed) {
    this.s = (seed >>> 0) || 1;
  }
  RNG.prototype.next = function () {
    var t = (this.s += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  RNG.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
  RNG.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };

  // ------------------------------------------------------------------ fx spawners
  R.burst = function (x, y, hex, n, speed, life) {

  };
  // slot: 0 = upper third (chain milestones), 1 = lower third (target), 2 = centre (perfect)

  };

  // Turn simulation events into light and noise. `quiet` = attract mode (no HUD floaters/banners).

    var evs = round.events;

      var e = evs[i];
      switch (e.t) {
        case 'spark':
          R.burst(e.x, e.y, '#FFFFFF', 26, 900, 0.7);
          R.rings.push({ x: e.x, y: e.y, r: 0, maxR: e.r * 1.6, t: 0, life: 0.55, c: '#FFFFFF' });
          R.addTrauma(0.18);
          if (!quiet) CB.Audio.spark();
          break;
        case 'pop': {
          var T = CB.MOTES[e.type];
          R.burst(e.x, e.y, T.color, e.type === 'nova' ? 22 : e.type === 'seedling' ? 4 : 10, e.type === 'nova' ? 900 : 520, 0.8);
          R.energy = Math.min(1, R.energy + 0.035);
          var rgb = hexToRgb(T.color);
          for (var k = 0; k < 3; k++) R.energyColor[k] += (rgb[k] - R.energyColor[k]) * 0.08;
          R.addTrauma(e.type === 'nova' ? 0.1 : e.type === 'crown' ? 0.25 : 0.012);
          if (!quiet) {
            CB.Audio.pop(e.chain, e.type);
            if (e.stolen) R.floater(e.x, e.y, 'stolen', '#8a7fb0', 0.8);
            else {
              if (e.glow && (e.chain < 45 || e.chain % 4 === 0)) R.floater(e.x, e.y, '+' + e.glow, '#FFD48A', 0.85);
              if (e.mult) R.floater(e.x, e.y - 30, '+' + CB.fmtMult(e.mult) + ' MULT', e.lucky ? '#7CF29C' : '#6FE6FF', 1.05, 0.08);
              if (e.xmult) { R.floater(e.x, e.y - 30, '×' + CB.fmtMult(e.xmult) + ' MULT', '#D9B8FF', 1.5, 0.05); R.doFlash(0.22, '#B98CFF'); R.disp.multPunch = 1; }
              if (e.money) R.floater(e.x + 30, e.y + 10, '+$' + e.money, '#FFE45E', 0.95, 0.12);
              if (e.mult) R.disp.multPunch = Math.max(R.disp.multPunch, 0.6);

            R.disp.glowPunch = Math.max(R.disp.glowPunch, 0.4);
            R.disp.chainPunch = 1;
          }
          if (e.type === 'crown') R.rings.push({ x: e.x, y: e.y, r: 0, maxR: 500, t: 0, life: 0.7, c: '#D9B8FF' });

        }

          break;
        case 'milestone':

          break;
        case 'echo':
          R.rings.push({ x: e.x, y: e.y, r: 0, maxR: 220, t: 0, life: 0.45, c: '#FF86D6' });

        case 'devour':

  // ------------------------------------------------------------------ update
  R.update = function (dt, realDt) {
    R.time += realDt;
    var i;

      var p = R.particles[i];
      p.t += dt;
      if (p.t > p.life) { R.particles.splice(i, 1); continue; }
      var drag = Math.exp(-3.2 * dt);
      p.vx *= drag; p.vy *= drag;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = R.floaters.length - 1; i >= 0; i--) {
      var f = R.floaters[i]; f.t += realDt;
      if (f.t > f.life) R.floaters.splice(i, 1);
    }
    for (i = R.banners.length - 1; i >= 0; i--) {
      var b = R.banners[i]; b.t += realDt;
      if (b.t > b.life) R.banners.splice(i, 1);
    }
    for (i = R.rings.length - 1; i >= 0; i--) {
      var rg = R.rings[i]; rg.t += dt;
      if (rg.t > rg.life) R.rings.splice(i, 1);
    }
    for (i = R.links.length - 1; i >= 0; i--) {
      var l = R.links[i]; l.t += dt;
      if (l.t > l.life) R.links.splice(i, 1);
    }

    R.flash = Math.max(0, R.flash - realDt * 2.2);
    R.energy = Math.max(0, R.energy - realDt * 0.6);
    var d = R.disp;
    d.punch = Math.max(0, d.punch - realDt * 4);
    d.multPunch = Math.max(0, d.multPunch - realDt * 3.5);
    d.glowPunch = Math.max(0, d.glowPunch - realDt * 3.5);
    d.chainPunch = Math.max(0, d.chainPunch - realDt * 5);
  };

  // ------------------------------------------------------------------ drawing
  function glyph(ctx, kind, x, y, r, color) {
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    switch (kind) {
      case 'star':
        ctx.beginPath();
        for (var i = 0; i < 8; i++) {
          var a = i / 8 * TAU - Math.PI / 2, rr = i % 2 ? r * 0.42 : r * 1.25;

        }

      case 'tri':
        ctx.beginPath();
        for (var t = 0; t < 3; t++) { var ta = t / 3 * TAU - Math.PI / 2; ctx.lineTo(x + Math.cos(ta) * r * 1.15, y + Math.sin(ta) * r * 1.15); }

      case 'double':

        ctx.beginPath(); ctx.arc(x, y, r * 1.05, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, TAU); ctx.fill(); break;

        ctx.lineTo(x, y - r * 1.1); ctx.lineTo(x + r * 0.6, y); ctx.lineTo(x + r * 1.2, y - r * 0.6); ctx.lineTo(x + r * 1.2, y + r * 0.7);

  // view: { round, hud, aim:{x,y,on}, target, info, money, timeScale, sparkR }
  R.draw = function (view) {
    var ctx = R.ctx, round = view.round;
    ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(R.bg, 0, 0, R.w, R.h);

    var sh = R.trauma * R.trauma * 16;
    var ox = sh ? (Math.random() * 2 - 1) * sh : 0, oy = sh ? (Math.random() * 2 - 1) * sh : 0;
    ctx.save();
    ctx.translate(ox, oy);

    var s = R.scale, ar = R.arenaPx / 2, i;

    // energy aura inside the jar
    if (R.energy > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = R.energy * 0.35;
      var ec = '#' + R.energyColor.map(function (v) { var h = Math.round(v).toString(16); return h.length < 2 ? '0' + h : h; }).join('');
      var spr = glowSprite(ec);
      ctx.drawImage(spr, R.cx - ar * 1.3, R.cy - ar * 1.3, ar * 2.6, ar * 2.6);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    if (round) {
      // big chain counter watermark
      var d = R.disp;
      if (round.chain >= 3 && round.isBusy()) { d.chain = round.chain; d.chainAlpha = Math.min(1, d.chainAlpha + 0.1); }
      else d.chainAlpha = Math.max(0, d.chainAlpha - 0.02);
      if (d.chainAlpha > 0 && view.hud) {
        var cs = ar * 0.34 * (1 + Math.log10(d.chain + 1) * 0.25) * (1 + d.chainPunch * 0.06);
        ctx.font = '700 ' + Math.round(cs) + 'px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(246,231,200,' + (0.1 * d.chainAlpha + d.chainPunch * 0.04) + ')';
        ctx.fillText(String(d.chain), R.cx, R.cy - cs * 0.05);
        ctx.font = '600 ' + Math.round(cs * 0.16) + 'px ' + FONT;
        ctx.fillStyle = 'rgba(246,231,200,' + (0.18 * d.chainAlpha) + ')';
        ctx.fillText('C H A I N', R.cx, R.cy + cs * 0.5);
      }

      // blooms
      ctx.globalCompositeOperation = 'lighter';
      var blooms = round.blooms;
      for (i = 0; i < blooms.length; i++) {
        var b = blooms[i];
        if (b.t < 0) continue;
        var p = R.w2s(b.x, b.y), br = b.r * s;
        var end = K.GROW + b.hold, a = 1;
        if (b.t > end) a = 1 - (b.t - end) / K.FADE;
        a = CB.clamp(a, 0, 1);
        if (b.damped) a *= 0.5;
        ctx.globalAlpha = a * 0.8;
        var petals = b.src === 'spark' ? 12 : (CB.MOTES[b.src].petals || 6);
        var disk = flowerSprite(b.color, petals);
        var bs = b.maxR * s * (b.t < K.GROW ? CB.easeOutBack(b.t / K.GROW) : 1);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((b.x * 0.013 + b.y * 0.007) + b.t * 0.35);
        ctx.drawImage(disk, -bs, -bs, bs * 2, bs * 2);
        ctx.restore();
        if (b.t < 0.12) {
          ctx.globalAlpha = (1 - b.t / 0.12) * 0.6;
          var gs = glowSprite(b.color);
          ctx.drawImage(gs, p.x - br * 0.9, p.y - br * 0.9, br * 1.8, br * 1.8);
        }
      }
      ctx.globalAlpha = 1;

      for (i = 0; i < R.rings.length; i++) {
        var rg = R.rings[i], rp = R.w2s(rg.x, rg.y), k = rg.t / rg.life;
        ctx.globalAlpha = (1 - k) * 0.7;
        ctx.strokeStyle = rg.c; ctx.lineWidth = Math.max(1, (1 - k) * 5);
        ctx.beginPath(); ctx.arc(rp.x, rp.y, CB.easeOutCubic(k) * rg.maxR * s, 0, TAU); ctx.stroke();
      }
      // afterglow links
      for (i = 0; i < R.links.length; i++) {
        var ln = R.links[i], a0 = R.w2s(ln.x0, ln.y0), a1 = R.w2s(ln.x1, ln.y1), lk = ln.t / ln.life;
        ctx.globalAlpha = 1 - lk; ctx.strokeStyle = '#FFF1D6'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a1.x, a1.y); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // motes
      var fog = round.mods.fog && view.hud;
      var motes = round.motes, t = R.time;
      var mr = Math.max(3.4, K.MOTE_R * s * 1.3);
      for (i = 0; i < motes.length; i++) {
        var m = motes[i];
        if (m.state === 2) continue;
        var T = CB.MOTES[m.type], mp = R.w2s(m.x, m.y);
        var vis = 1;
        if (fog && m.state === 0) vis = fogVisibility(m, round, view);
        if (vis <= 0.02) continue;
        var pulse = 1 + Math.sin(t * 3 + m.phase) * 0.08;
        var rr = (m.r / K.MOTE_R) * mr * pulse;
        if (m.type === 'void') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = vis;
          ctx.fillStyle = '#05030b';
          ctx.beginPath(); ctx.arc(mp.x, mp.y, rr * 1.1, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(155,123,255,0.85)'; ctx.lineWidth = Math.max(1.5, rr * 0.18);
          ctx.beginPath(); ctx.arc(mp.x, mp.y, rr * 1.15, t * 2 + m.phase, t * 2 + m.phase + Math.PI * 1.3); ctx.stroke();
          ctx.globalCompositeOperation = 'lighter';
          continue;
        }
        ctx.globalCompositeOperation = 'lighter';
        var lit = m.state === 1;
        ctx.globalAlpha = (lit ? 1 : 0.9) * vis;
        var gsz = rr * (lit ? 10 : 7);
        ctx.drawImage(glowSprite(T.color), mp.x - gsz / 2, mp.y - gsz / 2, gsz, gsz);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = vis;
        glyph(ctx, T.glyph, mp.x, mp.y, rr * (lit ? 1.3 : 1), lit ? '#FFFFFF' : T.core);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'lighter';

      // particles
      for (i = 0; i < R.particles.length; i++) {
        var q = R.particles[i], qp = R.w2s(q.x, q.y), qa = 1 - q.t / q.life;
        var qs = Math.max(5, 60 * s * q.size) * (0.5 + qa * 0.5);
        ctx.globalAlpha = qa;
        ctx.drawImage(glowSprite(q.c), qp.x - qs / 2, qp.y - qs / 2, qs, qs);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    drawRim(ctx, view);

    // aim preview
    if (round && view.aim && view.aim.on && round.canRelease() && view.hud) {

      ctx.strokeStyle = 'rgba(255,255,255,' + pulseA + ')';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 7]);
      ctx.lineDashOffset = -R.time * 20;
      ctx.beginPath(); ctx.arc(ap.x, ap.y, pr, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

    // floaters
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      var f = R.floaters[i];
      if (f.t < 0) continue;
      var fk = f.t / f.life, fp = R.w2s(f.x, f.y);

      ctx.font = '700 ' + fs + 'px ' + FONT;

      ctx.fillText(f.text, fp.x, fp.y - fk * 40);
    }
    ctx.globalAlpha = 1;

    // banners
    for (i = 0; i < R.banners.length; i++) drawBanner(ctx, R.banners[i]);

    ctx.restore();

    if (view.hud && round) drawHUD(ctx, view);

    // slow-mo vignette
    if (view.timeScale < 0.9) {
      ctx.globalAlpha = (1 - view.timeScale) * 0.5;
      var vg = ctx.createRadialGradient(R.cx, R.cy, R.arenaPx * 0.4, R.cx, R.cy, Math.max(R.w, R.h) * 0.7);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.9)');

    if (R.flash > 0.01) {

      ctx.fillStyle = R.flashColor;
      ctx.fillRect(0, 0, R.w, R.h);
      ctx.globalAlpha = 1;
    }
  };

  function fogVisibility(m, round, view) {
    var best = 1e9, bl = round.blooms;
    for (var i = 0; i < bl.length; i++) {
      var b = bl[i]; if (b.t < 0) continue;

      if (d < best) best = d;

// CHAINBLOOM — built-in clip capture. Every round is recorded from the first Spark to the last bloom,
// with game audio, so players can save "that chain" as a video in one tap. Social posts are the marketing.
(function (CB) {
  'use strict';

  var C = { supported: false, rec: null, chunks: [], last: null, enabled: true, stream: null, mime: '' };

  C.init = function (canvas) {
    try {
      if (CB.EMBED || !canvas.captureStream || typeof MediaRecorder === 'undefined') return;
      var types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
      for (var i = 0; i < types.length; i++) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) { C.mime = types[i]; break; }
      }
      if (!C.mime) return;
      C.canvas = canvas;
      C.supported = true;
    } catch (e) { C.supported = false; }
  };

  C.start = function () {
    if (!C.supported || !C.enabled || C.rec) return;
    try {
      var stream = C.canvas.captureStream(60);
      var A = CB.Audio;
      if (A.streamDest) {
        A.streamDest.stream.getAudioTracks().forEach(function (t) { stream.addTrack(t); });
      }
      C.chunks = [];
      var rec = new MediaRecorder(stream, { mimeType: C.mime, videoBitsPerSecond: 8000000 });
      rec.ondataavailable = function (e) { if (e.data && e.data.size) C.chunks.push(e.data); };
      rec.onstop = function () {
        if (C.chunks.length) C.last = { blob: new Blob(C.chunks, { type: C.mime.split(';')[0] }), meta: C.pendingMeta || {} };
        stream.getVideoTracks().forEach(function (t) { t.stop(); });
        C.rec = null;
        if (C.onready) C.onready(C.last);
      };
      rec.start(250);
      C.rec = rec;
      C.last = null;
    } catch (e) { C.rec = null; }
  };

  C.stop = function (meta) {
    if (!C.rec) return;
    C.pendingMeta = meta;
    try { C.rec.stop(); } catch (e) { C.rec = null; }
  };

  C.cancel = function () {
    if (!C.rec) return;
    C.pendingMeta = null;
    var r = C.rec; C.rec = null;
    r.onstop = null;
    try { r.stop(); } catch (e) { /* ignore */ }
  };

  C.save = function () {
    if (!C.last) return false;
    var ext = C.last.blob.type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    var m = C.last.meta || {};
    var name = 'chainbloom-' + (m.chain ? 'chain' + m.chain + '-' : '') + (m.score ? CB.fmt(m.score).replace(/[^0-9A-Za-z.]/g, '') : 'clip') + '.' + ext;
    return CB.downloadBlob(C.last.blob, name);
  };

  CB.downloadBlob = function (blob, name) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
      return true;
    } catch (e) { return false; }
  };

})(CB);

// ---- src/main.js
// CHAINBLOOM — boot, main loop, input, and the screen flow (title → jar → round → result → shop → …).
(function (CB) {
  'use strict';
  var STEP = 1 / 120;
  var R = CB.Render, UI = CB.UI, A = CB.Audio, Clip = CB.Clip;

  var G = {
    state: 'boot', profile: null, run: null, round: null, preview: null, attract: null, lastRes: null,
    aim: { x: 0, y: 0, on: false }, pressed: false, ts: 1, acc: 0, endT: 0, paused: false,
    jarSel: 'ember', back: null, inputLockUntil: 0, clipStarted: false, last: 0, hudT: 0,
    attractWait: 0, saveClipWhenReady: false, tutorialStep: 0

  // ------------------------------------------------------------------ boot
  G.boot = function () {
    G.profile = CB.loadProfile();
    if (G.profile.settings.clips === undefined) G.profile.settings.clips = 1;
    G.jarSel = G.profile.lastJar || 'ember';
    var canvas = document.getElementById('game');
    R.init(canvas);
    UI.init(G);
    UI.layoutVars();
    Clip.init(canvas);
    Clip.onready = function (clip) {
      if (clip && G.run && (!Clip.best || (clip.meta.chain || 0) >= (Clip.best.meta.chain || 0))) Clip.best = clip;
      if (G.saveClipWhenReady) { G.saveClipWhenReady = false; Clip.save(); }
    };
    G.applySettings();
    window.addEventListener('resize', function () { R.resize(); UI.layoutVars(); });
    G.bindInput(canvas);
    G.newAttract();
    var skip = /[?&](skip|nosplash)/.test(location.search);
    if (skip) G.goTitle();
    else { G.state = 'splash'; UI.splash(); G._splashT = setTimeout(G.goTitle, 2100); }
    G.last = performance.now();
    G.schedule();
  };

  G.applySettings = function () {
    var s = G.profile.settings;
    A.setVolumes(+s.sfx, +s.music);
    R.settings.shake = s.shake ? 1 : 0;
    R.settings.flashes = s.flashes ? 1 : 0;
    Clip.enabled = !!s.clips;
  };
  G.save = function () { CB.saveProfile(G.profile); };

  // ------------------------------------------------------------------ attract mode (title screen chains, played by the AI)
  G.newAttract = function () {
    var seed = (Math.random() * 1e9) >>> 0;
    var mods = CB.baseMods();
    mods.sparks = 999;
    G.attract = new CB.Round({
      jar: { ember: 46, nova: 7, seed: 5, prism: 6, coin: 5, echo: 4, crown: 2 },
      mods: mods, rng: new CB.RNG(seed), info: {}
    });
    G.attractRng = new CB.RNG(seed ^ 77);
    G.attractWait = 1.4;
  };
  function stepAttract(dt) {
    var r = G.attract;
    if (!r.isBusy()) {
      G.attractWait -= dt;
      if (G.attractWait <= 0) {
        if (r.remaining() < 14 || r.done || r.sparksUsed >= 4) { G.newAttract(); return; }
        var p = CB.aiChoose(r, G.attractRng, 24);
        r.release(p.x, p.y);
        G.attractWait = 1.1;
      }
    }
    G.acc += dt;
    var n = 0;
    while (G.acc >= STEP && n++ < 12) { r.step(STEP); G.acc -= STEP; }
    R.handleEvents(r, true);
  }

  // ------------------------------------------------------------------ input
  G.bindInput = function (canvas) {
    function pos(e) { G.aim.x = e.clientX; G.aim.y = e.clientY; }
    canvas.addEventListener('pointermove', function (e) {
      pos(e);
      G.aim.on = e.pointerType === 'mouse' || G.pressed;
    });
    canvas.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') G.aim.on = false; });
    canvas.addEventListener('pointerdown', function (e) {
      G.unlockAudio();
      G.pressed = true; G.aim.on = true; pos(e);
    });
    canvas.addEventListener('pointerup', function (e) {
      pos(e);
      G.pressed = false;
      if (e.pointerType !== 'mouse') G.aim.on = false;
      if (G.state === 'play' && !G.paused && performance.now() > G.inputLockUntil && R.inArena(e.clientX, e.clientY)) {
        var w = R.s2w(e.clientX, e.clientY);
        if (G.round.release(w.x, w.y)) G.onRelease();
      }
    });
    document.addEventListener('pointerdown', function () { G.unlockAudio(); }, { capture: true });
    document.addEventListener('keydown', function (e) {
      G.unlockAudio();
      if (e.key === 'Escape') {
        if (G.state === 'play' || G.state === 'shop') G.action(G.paused ? 'resume' : 'pause');
      } else if (e.key === ' ' || e.key === 'Enter') {
        if (G.state === 'result') { e.preventDefault(); G.action('afterResult'); }
        else if (G.state === 'shop' && !G.paused) { e.preventDefault(); G.action('nextRound'); }
      } else if (e.key === 'b' || e.key === 'B') {
        if (G.state === 'play') G.action('bank');
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && G.state === 'play' && !G.paused && G.round && !G.round.isBusy()) G.action('pause');
    });
  };
  G.unlockAudio = function () {
    A.init();
    if (A.ready && !A.musicStarted) A.startMusic();
  };

  // ------------------------------------------------------------------ flow
  G.goTitle = function () {
    clearTimeout(G._splashT);
    G.state = 'title'; G.paused = false; G.run = null; G.round = null; G.preview = null;
    UI.hudShow(false);
    UI.title(G.profile);
    G.back = function () { UI.title(G.profile); };
  };

  G.startRun = function (jarId, daily) {
    var opts = { jarId: jarId };
    if (daily) {
      opts.daily = true;
      opts.seed = CB.hashString('chainbloom-daily-' + CB.todaySeedString());
    }
    G.run = new CB.Run(opts);
    G.profile.runs++;
    G.profile.lastJar = jarId;
    G.save();
    Clip.best = null;
    G.beginRound();
  };

  G.beginRound = function () {
    var run = G.run;
    G.round = run.makeRound();
    G.preview = null;
    G.state = 'play'; G.paused = false;
    G.ts = 1; G.acc = 0; G.endT = 0; G.clipStarted = false;
    R.reset();
    UI.clear();
    UI.hudShow(true);
    UI.catKey = '';
    var info = G.round.info;
    UI.intro(info);
    A.ui('whoosh');
    G.inputLockUntil = performance.now() + 500;
    // first-time mote types get a toast
    var seen = G.profile.seenMotes || (G.profile.seenMotes = {});
    Object.keys(run.jar).forEach(function (t) {
      if (run.jar[t] > 0 && !seen[t]) {
        seen[t] = true;
        if (G.profile.runs > 1 || run.ante > 1) UI.toast('<b>New mote:</b> ' + CB.MOTES[t].name + ' — ' + CB.moteDesc(t, run.levels));
      }
    });
    if (G.round.mods.voids && !seen['void']) { seen['void'] = true; UI.toast('<b>Voids</b> swallow any bloom that touches them'); }
    if (!G.profile.tutorialDone) {
      G.tutorialStep = 1;
      setTimeout(function () { if (G.tutorialStep === 1 && G.state === 'play') UI.hint('Tap anywhere in the jar to release a <b>Spark</b> ✦'); }, 1400);
    }
  };

  G.onRelease = function () {
    if (G.tutorialStep === 1) {
      G.tutorialStep = 2;
      UI.hint('Everything the light touches <b>blooms</b> — and lights its neighbours.');
      setTimeout(function () { if (G.tutorialStep === 2) UI.hint(null); }, 3800);
    } else if (G.tutorialStep === 3) {
      G.tutorialStep = 4; UI.hint(null);
    }
  };

  G.finishRound = function () {
    var round = G.round, run = G.run, p = G.profile;
    Clip.stop({ chain: round.bestChain, score: round.score() });
    var res = run.settle(round);
    G.lastRes = res;
    p.totalPops += round.pops;
    p.perfects += round.perfect ? 1 : 0;
    var before = CB.JARS.filter(function (j) { return CB.jarUnlocked(j, p); }).length;
    if (round.bestChain > p.bestChain) p.bestChain = round.bestChain;
    if (res.score > p.bestScore) p.bestScore = res.score;
    if (run.ante > p.bestAnte && !run.over) p.bestAnte = Math.min(run.ante, 99);
    if (run.stats.bestMoney > p.bestMoney) p.bestMoney = run.stats.bestMoney;
    if (res.runWon) p.wins++;
    var after = CB.JARS.filter(function (j) { return CB.jarUnlocked(j, p); });
    if (after.length > before) G._newJar = after[after.length - 1];
    G.save();
    G.state = 'result';
    UI.hudShow(false);
    if (G.tutorialStep && G.tutorialStep < 3) G.tutorialStep = 3;
    UI.result(res, run, Clip.supported && Clip.enabled);
  };

  G.goShop = function () {
    var run = G.run;
    run.rollShop();
    G.markSeen();
    G.state = 'shop';
    G.preview = run.makeRound();
    UI.shop(run, G.profile);
    G.back = function () { UI.shop(run, G.profile); };
    if (!G.profile.shopSeen) { G.profile.shopSeen = true; G.profile.tutorialDone = true; G.tutorialStep = 0; G.save(); }
    if (G._newJar) { UI.toast('🔓 <b>Unlocked:</b> ' + G._newJar.name); G._newJar = null; }
  };
  G.markSeen = function () {
    var run = G.run, p = G.profile;
    Object.keys(run.seen).forEach(function (id) { p.seenCatalysts[id] = true; });
    G.save();
  };

  G.gameOver = function (victory) {
    var run = G.run, p = G.profile;
    G.state = 'over';
    UI.hudShow(false);
    if (run.daily) {
      var key = CB.todaySeedString(), d = p.daily[key] || { best: 0, ante: 0, plays: 0 };
      d.best = Math.max(d.best, run.stats.bestScore);
      d.ante = Math.max(d.ante, run.ante);
      d.plays++;
      p.daily[key] = d;
    }
    G.save();
    UI.gameOver(run, p, victory);
    G.back = function () { UI.gameOver(run, p, victory); };
  };

  // ------------------------------------------------------------------ UI actions
  G.action = function (a, data, el) {
    data = data || {};
    var run = G.run, p = G.profile;
    switch (a) {
      case 'skipSplash': G.unlockAudio(); G.goTitle(); break;
      case 'play':
        A.ui('click');
        var unlocked = CB.JARS.filter(function (j) { return CB.jarUnlocked(j, p); });
        if (unlocked.length <= 1) G.startRun('ember');
        else { G.state = 'jars'; UI.jars(p, G.jarSel); G.back = function () { UI.jars(p, G.jarSel); }; }
        break;
      case 'pickJar': A.ui('click'); G.jarSel = data.id; UI.jars(p, G.jarSel); break;
      case 'startRun': A.ui('click'); G.startRun(G.jarSel); break;
      case 'daily': A.ui('click'); G.startRun('ember', true); break;
      case 'title': A.ui('click'); G.goTitle(); break;
      case 'book': A.ui('click'); UI.book(p); break;
      case 'bookTab': A.ui('click'); UI.book(p, data.tab); break;
      case 'settings': A.ui('click'); UI.settings(p); break;
      case 'back':
        A.ui('click');
        if (G.paused) UI.pause(!!G.run);
        else if (G.back) G.back();
        break;
      case 'toggle':
        p.settings[data.key] = p.settings[data.key] ? 0 : 1;
        G.applySettings(); G.save(); A.ui('click');
        UI.settings(p);
        break;
      case 'setting':
        p.settings[data.key] = +data.value;
        G.applySettings(); G.save();
        break;
      case 'resetProgress':
        // Two-tap confirm in-page (native confirm() is unavailable in some embeds).
        if (el && el.dataset.armed) {
          G.profile = CB.defaultProfile(); G.save(); G.applySettings(); G.goTitle();
        } else if (el) {
          el.dataset.armed = '1'; el.textContent = 'Tap again to erase everything';
        }
        break;
      case 'pause':
        if (G.state !== 'play' && G.state !== 'shop') break;
        A.ui('click');
        G.paused = true;
        UI.pause(true);
        break;
      case 'resume':
        A.ui('click');
        G.paused = false;
        if (G.state === 'play') UI.clear();
        else if (G.state === 'shop') UI.shop(run, p);
        break;
      case 'abandon':
        A.ui('click');
        G.paused = false;
        Clip.cancel();
        run.over = true;
        G.gameOver(false);
        break;
      case 'bank':
        if (G.round && G.canBank()) { G.round.bank(); A.ui('buy'); }
        break;
      case 'chip':
        if (el) el.classList.toggle('show');
        break;
      case 'saveClip':
        A.ui('click');
        if (Clip.last) Clip.save();
        else if (Clip.rec) { G.saveClipWhenReady = true; }
        if (el) { el.textContent = '✓ Saved'; el.disabled = true; }
        break;
      case 'saveBestClip':
        if (Clip.best) { var keep = Clip.last; Clip.last = Clip.best; Clip.save(); Clip.last = keep; }
        break;
      case 'afterResult':
        A.ui('click');
        if (G.lastRes && G.lastRes.runWon) G.gameOver(true);
        else if (run.over) G.gameOver(false);
        else G.goShop();
        break;
      case 'buy': {
        var it = run.shop[+data.i];
        var wasPack = it && it.kind === 'pack';
        if (run.buy(+data.i)) {
          A.ui('buy');
          G.markSeen();
          if (wasPack) {
            G.preview = run.makeRound();
            R.burst(0, 0, CB.MOTES[CB.PACKS.filter(function (pk) { return pk.id === it.id; })[0].type].color, 40, 1400, 1.0);
          }
          UI.shop(run, p);
        } else A.ui('deny');
        break;
      }
      case 'sell':
        if (run.sell(+data.i)) { A.ui('sell'); UI.shop(run, p); }
        break;
      case 'reroll':
        if (run.reroll()) { A.ui('click'); G.markSeen(); UI.shop(run, p); } else A.ui('deny');
        break;
      case 'nextRound':
        A.ui('click');
        G.beginRound();
        break;
      case 'copyShare': {
        var text = run.shareText();
        var done = function () { UI.toast('Copied — go brag 🌸'); };
        var fallback = function () { UI.showShareText(text); };
        try { navigator.clipboard.writeText(text).then(done, fallback); }
        catch (e) { fallback(); }
        break;
      }
      case 'saveCard':
        if (UI._card) {
          var a2 = document.createElement('a'); a2.href = UI._card; a2.download = 'chainbloom-run.png';
          document.body.appendChild(a2); a2.click(); a2.remove();
        }
        break;
      case 'endless':
        A.ui('click');
        run.continueEndless();
        G.goShop();
        break;
    }
  };

  G.canBank = function () {
    var r = G.round;
    return G.state === 'play' && r && !r.done && r.started && r.sparksLeft > 0 && !r.isBusy() && r.score() >= r.info.target;
  };

  // ------------------------------------------------------------------ main loop
  G.loop = function (now) {
    var realDt = Math.min(0.05, (now - G.last) / 1000);
    G.last = now;
    var dt = realDt, view = { round: null, hud: false, aim: G.aim, timeScale: 1, target: 0, info: null, money: 0, sparkR: 0 };

    if ((G.state === 'play' || G.state === 'result') && G.round) {
      var r = G.round;
      if (G.state === 'play' && !G.paused) {
        var slow = r.started && !r.done && r.remaining() > 0 && r.remaining() <= 3 && r.isBusy();
        var targetTs = slow ? 0.3 : 1;
        G.ts += (targetTs - G.ts) * Math.min(1, realDt * 8);
        dt = realDt * G.ts;
        G.acc += dt;
        var n = 0;
        while (G.acc >= STEP && n++ < 20) { r.step(STEP); G.acc -= STEP; }
        R.handleEvents(r, false, r.info.target);
        if (r.started && !G.clipStarted) { G.clipStarted = true; Clip.start(); }
        A.setIntensity(r.isBusy() ? Math.min(1, r.chain / 50) : 0);
        if (r.done) {
          G.endT += realDt;
          if (G.endT > 1.3) G.finishRound();
        }
        G.hudT -= realDt;
        if (G.hudT <= 0) { G.hudT = 0.1; UI.hudUpdate(G.run, r, G.canBank()); }
        if (G.tutorialStep === 3 && r.sparksLeft > 0 && !r.isBusy() && r.started && !r.done) {
          UI.hint('You have another Spark — aim for the busiest patch.'); G.tutorialStep = 4;
        }
      } else dt = 0;
      view.round = r; view.hud = true; view.timeScale = G.ts;
      view.target = r.info.target; view.info = r.info; view.money = G.run.money;
      view.sparkR = CB.K.BLOOM_R * r.mods.sparkScale * r.mods.bloomScale;
      if (G.state === 'result') view.money = G.run.money - r.money;
    } else if (G.state === 'shop' && G.preview) {
      if (!G.paused) {
        G.acc += dt; var m = 0;
        while (G.acc >= STEP && m++ < 12) { G.preview.step(STEP); G.acc -= STEP; }
      }
      G.preview.events.length = 0;
      view.round = G.preview;
    } else {
      stepAttract(dt);
      view.round = G.attract;
      A.setIntensity(G.attract.isBusy() ? 0.25 : 0);
    }

    R.update(dt, realDt);
    R.draw(view);
    G.schedule();
  };
  // ?tick drives the loop with timers instead of rAF — for automated testing in hidden/background pages.
  G.timerTick = /[?&]tick/.test(location.search);
  G.schedule = function () {
    if (G.timerTick) setTimeout(function () { G.loop(performance.now()); }, 16);
    else requestAnimationFrame(G.loop);
  };

  function start() {
    // Draw with the real font where possible, but never block on it.
    var go = function () { if (G.state === 'boot') G.boot(); };
    if (document.fonts && document.fonts.load) {
      Promise.race([document.fonts.load('700 40px Fredoka'), new Promise(function (r) { setTimeout(r, 900); })]).then(go, go);
    } else go();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(CB);

</script>
</body>
</html>
