<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B1F">
<title>PEPPERED</title>
<meta name="description" content="Paint a moth. Hide it anywhere. Dare a friend to find it. A tiny camouflage game by Mothlamp.">
<meta property="og:title" content="PEPPERED — can you find the moth?">
<meta property="og:description" content="Someone painted a moth to vanish into this scene. You have a lamp and 45 seconds.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PEPPERED — UI layer. Mothlamp palette: midnight ink, one warm lamp, colour only where something is alive. */
:root {
  --ink: #0E0B1F;
  --ink-2: #16112F;
  --ink-3: #221A45;
  --line: rgba(246, 231, 200, 0.14);
  --cream: #F6E7C8;
  --cream-dim: rgba(246, 231, 200, 0.62);
  --amber: #FFB547;
  --gold: #FFE45E;
  --coral: #FF5E6C;
  --cyan: #6FE6FF;
  --violet: #B98CFF;
  --green: #6EF29A;
  --pink: #FF86D6;
  --moon: #A9C4FF;
  --r: 18px;
  --font: "Fredoka", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ink); color: var(--cream);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}
canvas#game { position: fixed; inset: 0; display: block; }
body.seek canvas#game { cursor: none; }
body.edit-move canvas#game { cursor: grab; }
body.edit-paint canvas#game { cursor: crosshair; }
body.edit-pick canvas#game { cursor: copy; }
button { font-family: inherit; }
input, textarea { font-family: inherit; user-select: text; -webkit-user-select: text; }

#ui, #hud { position: fixed; inset: 0; pointer-events: none; }
#ui > *, #hud > * { pointer-events: auto; }
#hud { z-index: 2; }
#ui { z-index: 3; }

/* ---------------------------------------------------------------- buttons */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: 600 18px/1 var(--font); letter-spacing: 0.02em;
  color: var(--ink); background: var(--amber);
  padding: 14px 26px; border-radius: 999px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) inset, 0 8px 30px rgba(255, 181, 71, 0.28);
  transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 0 12px 40px rgba(255, 181, 71, 0.45); }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn.ghost { background: rgba(246, 231, 200, 0.06); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; }
.btn.ghost:hover { background: rgba(246, 231, 200, 0.12); }
.btn.moon { background: var(--moon); box-shadow: 0 8px 30px rgba(169, 196, 255, 0.3); }
.btn.small { font-size: 15px; padding: 10px 16px; }
.btn.tiny { font-size: 13px; padding: 8px 12px; }
.btn[disabled], .btn.disabled { filter: grayscale(0.8) brightness(0.6); cursor: not-allowed; transform: none; }
.icon-btn {
  appearance: none; border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(14, 11, 31, 0.6); color: var(--cream); font-size: 17px;
  box-shadow: 0 0 0 1px var(--line) inset; backdrop-filter: blur(6px);
  display: inline-grid; place-items: center; flex: none;
}
.icon-btn:hover { background: rgba(34, 26, 69, 0.9); }
.icon-btn.on { background: var(--amber); color: var(--ink); }

/* ---------------------------------------------------------------- overlays + panels */
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  animation: fadeIn 0.35s ease both;
}
.overlay.dim { background: rgba(7, 5, 16, 0.62); backdrop-filter: blur(3px); }
.overlay.clear { pointer-events: none !important; }
.overlay.clear > * { pointer-events: auto; }
.overlay.scroll { align-items: flex-start; overflow-y: auto; }
.overlay.bottom { align-items: flex-end; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

.panel {
  width: min(520px, 100%);
  background: linear-gradient(180deg, rgba(34, 26, 69, 0.94), rgba(14, 11, 31, 0.97));
  border-radius: 28px; padding: 26px;
  box-shadow: 0 0 0 1px var(--line) inset, 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: rise 0.4s cubic-bezier(.2, .9, .3, 1.2) both;
}
.panel.wide { width: min(900px, 100%); }
.panel h2 { margin: 0 0 6px; font-size: 30px; font-weight: 700; }
.panel h3 { margin: 18px 0 10px; font-size: 18px; }
.panel .sub { color: var(--cream-dim); margin: 0 0 18px; font-size: 16px; line-height: 1.4; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.eyebrow { font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cream-dim); font-weight: 600; }
.muted { color: var(--cream-dim); }

/* ---------------------------------------------------------------- splash + title */
.splash { flex-direction: column; gap: 14px; background: var(--ink); cursor: pointer; }
.splash svg { width: 92px; height: 92px; animation: pop 0.9s cubic-bezier(.2, .9, .3, 1.3) both; filter: drop-shadow(0 0 24px rgba(255, 181, 71, 0.55)); }
.splash .studio { font-size: 22px; letter-spacing: 0.4em; font-weight: 600; text-transform: lowercase; animation: rise 0.8s 0.3s both; }
.splash .tag { color: var(--cream-dim); font-size: 14px; letter-spacing: 0.1em; animation: rise 0.8s 0.5s both; }

.title { flex-direction: column; gap: 8px; text-align: center; background: radial-gradient(ellipse at 50% 42%, rgba(14,11,31,0.25), rgba(14,11,31,0.86) 72%); }
.title .moth-logo { width: clamp(84px, 16vw, 120px); height: auto; margin-bottom: 4px; animation: pop 0.9s cubic-bezier(.2, .9, .3, 1.3) both; filter: drop-shadow(0 0 26px rgba(255, 181, 71, 0.5)); }
.logo {
  font-weight: 700; font-size: clamp(50px, 12vw, 116px); line-height: 0.9; letter-spacing: 0.04em; margin: 0;
  color: var(--cream);
  text-shadow: 0 0 34px rgba(255, 181, 71, 0.55), 0 0 2px rgba(255, 228, 160, 0.8);
  animation: pop 0.8s cubic-bezier(.2, .9, .3, 1.3) both;
}
.logo .dot { color: var(--amber); }
.tagline { font-size: clamp(16px, 3.6vw, 22px); color: var(--cream); margin: 4px 0 22px; font-weight: 500; animation: rise 0.7s 0.2s both; max-width: 28ch; line-height: 1.3; }
.menu { display: flex; flex-direction: column; gap: 11px; align-items: center; width: min(320px, 90vw); animation: rise 0.7s 0.35s both; }
.menu .btn { width: 100%; }
.menu .btn small { display: block; font-size: 12px; font-weight: 500; opacity: 0.75; letter-spacing: 0.04em; }
.menu .btn .two { display: flex; flex-direction: column; gap: 4px; }
.menu .minor { display: flex; gap: 10px; width: 100%; }
.menu .minor .btn { flex: 1; }
.title .foot { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; color: var(--cream-dim); font-size: 13px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 0 16px; pointer-events: none; }
.title .studio-mark { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 20px; display: flex; gap: 8px; align-items: center; font-size: 14px; letter-spacing: 0.25em; color: var(--cream-dim); }
.title .studio-mark svg { width: 26px; height: 26px; }
.title .gear { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; }

/* ---------------------------------------------------------------- seek HUD */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) 14px 8px;
}
.topbar .ttl { flex: 1; min-width: 0; text-align: center; }
.topbar .ttl b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .ttl small { color: var(--cream-dim); font-size: 13px; }
.moths-left { display: flex; gap: 4px; min-width: 42px; justify-content: flex-end; }
.moths-left svg { width: 22px; height: 22px; transition: 0.3s; }
.moths-left svg.got { filter: drop-shadow(0 0 6px rgba(255, 181, 71, 0.9)); }
.timer { position: absolute; height: 5px; border-radius: 3px; background: rgba(246, 231, 200, 0.1); overflow: hidden; }
.timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--gold)); border-radius: 3px; transition: width 0.1s linear; }
.timer.low i { background: linear-gradient(90deg, var(--coral), #ff8f6c); }
.clock { position: absolute; font-size: 15px; font-weight: 600; color: var(--cream); text-shadow: 0 1px 6px rgba(0,0,0,0.8); pointer-events: none !important; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--coral); }

.intro-card { text-align: center; pointer-events: auto; cursor: pointer; animation: rise 0.5s both; padding: 26px 28px; max-width: min(380px, 92vw); }
.intro-card h2 { margin: 6px 0; font-size: clamp(28px, 6vw, 40px); }
.intro-card p { margin: 0 0 18px; color: var(--cream-dim); font-size: 16px; line-height: 1.4; }
.intro-card .facts { display: flex; gap: 18px; justify-content: center; margin: 0 0 20px; }
.intro-card .facts div { font-size: 13px; color: var(--cream-dim); }
.intro-card .facts b { display: block; font-size: 24px; color: var(--cream); }

.hint {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--botH, 24px) + 22px);
  background: rgba(14, 11, 31, 0.9); padding: 12px 18px; border-radius: 16px; font-size: 16px; text-align: center; width: max-content; max-width: min(420px, 90vw);
  box-shadow: 0 0 0 1px rgba(255, 181, 71, 0.4) inset, 0 0 30px rgba(255, 181, 71, 0.15); pointer-events: none !important;
  animation: hintIn 0.4s both; line-height: 1.35;
}
@keyframes hintIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toasts { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none !important; }
.toast { background: rgba(14, 11, 31, 0.94); padding: 10px 16px; border-radius: 14px; font-size: 15px; box-shadow: 0 0 0 1px var(--line) inset; animation: toast 3.4s ease both; white-space: nowrap; }
.toast b { color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------------------------------------------------------------- results */
.result { text-align: center; }
.result h2.win { color: var(--gold); text-shadow: 0 0 30px rgba(255, 228, 94, 0.45); }
.result h2.lose { color: var(--coral); }
.stars { font-size: 34px; letter-spacing: 6px; margin: 4px 0 10px; }
.stars .on { color: var(--gold); text-shadow: 0 0 16px rgba(255, 228, 94, 0.7); }
.stars .off { color: rgba(246, 231, 200, 0.18); }
.big { font-size: clamp(40px, 10vw, 64px); font-weight: 700; line-height: 1; margin: 6px 0 4px; text-shadow: 0 0 30px rgba(255, 181, 71, 0.5); font-variant-numeric: tabular-nums; }
.times { list-style: none; padding: 0; margin: 4px 0 18px; }
.times li { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px dashed var(--line); animation: rise 0.35s both; font-size: 16px; }
.times li span:last-child { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.times li.miss span:last-child { color: var(--coral); }
.stats-row { display: flex; justify-content: center; gap: 22px; margin: 6px 0 18px; color: var(--cream-dim); font-size: 14px; flex-wrap: wrap; }
.stats-row b { display: block; color: var(--cream); font-size: 22px; }
.share-text { white-space: pre-wrap; font-size: 15px; background: rgba(0,0,0,0.28); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; text-align: left; line-height: 1.45; }
.unlock { margin: 0 0 16px; padding: 10px 14px; border-radius: 14px; background: rgba(255, 181, 71, 0.1); box-shadow: 0 0 0 1px rgba(255, 181, 71, 0.4) inset; font-size: 15px; }
.unlock b { color: var(--gold); }
.result-dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px max(12px, env(safe-area-inset-bottom)); display: flex; justify-content: center; }
.result-dock .panel { padding: 20px 20px 18px; }

/* ---------------------------------------------------------------- walk map */
.walks { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 4px; }
.walk-row { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 8px; border-radius: 16px; background: rgba(246,231,200,0.03); box-shadow: 0 0 0 1px var(--line) inset; }
.walk-row img { width: 56px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
.walk-row .nm { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
.walk-row .lv { display: flex; gap: 8px; flex-wrap: wrap; }
.walk-btn { appearance: none; border: 0; cursor: pointer; border-radius: 12px; padding: 8px 10px; min-width: 84px; background: rgba(246,231,200,0.07); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; font: 600 14px/1.1 var(--font); text-align: left; transition: 0.15s; }
.walk-btn:hover { background: rgba(255, 181, 71, 0.16); transform: translateY(-2px); }
.walk-btn small { display: block; font-weight: 500; font-size: 12px; color: var(--gold); margin-top: 3px; letter-spacing: 1px; }
.walk-btn.locked { opacity: 0.35; cursor: not-allowed; transform: none; }
.walk-btn.next { box-shadow: 0 0 0 2px var(--amber) inset, 0 0 18px rgba(255,181,71,0.3); }

/* ---------------------------------------------------------------- hide: pick */
.scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin: 8px 0 16px; }
.scene-card { appearance: none; border: 0; cursor: pointer; padding: 0; border-radius: 14px; overflow: hidden; position: relative; background: #000; box-shadow: 0 0 0 1px var(--line); transition: 0.15s; color: var(--cream); font-family: inherit; }
.scene-card img { width: 100%; aspect-ratio: 9 / 13; object-fit: cover; display: block; }
.scene-card span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 6px 6px; font-size: 12px; font-weight: 600; background: linear-gradient(0deg, rgba(14,11,31,0.95), rgba(14,11,31,0)); text-align: center; line-height: 1.15; }
.scene-card:hover { transform: translateY(-3px); }
.scene-card.sel { box-shadow: 0 0 0 3px var(--amber), 0 0 24px rgba(255,181,71,0.45); }
.scene-card.locked { cursor: not-allowed; }
.scene-card.locked img { filter: grayscale(1) brightness(0.35); }
.scene-card .lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; text-align: center; padding: 8px; color: var(--cream-dim); }
.species { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
.sp-chip { appearance: none; border: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(246,231,200,0.06); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; font: 600 14px var(--font); }
.sp-chip img { width: 34px; height: 28px; object-fit: contain; }
.sp-chip.sel { box-shadow: 0 0 0 2px var(--amber) inset; background: rgba(255,181,71,0.14); }
.sp-chip.locked { opacity: 0.4; cursor: not-allowed; }
.sp-chip small { color: var(--cream-dim); font-weight: 500; }

/* ---------------------------------------------------------------- hide: editor */
.toolbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 12px max(10px, env(safe-area-inset-bottom));
  background: linear-gradient(0deg, rgba(14, 11, 31, 0.98), rgba(14, 11, 31, 0.9));
  box-shadow: 0 -1px 0 var(--line); display: flex; flex-direction: column; gap: 9px;
}
body.wide .toolbar { left: auto; top: 0; width: 320px; justify-content: center; box-shadow: -1px 0 0 var(--line); padding: 20px; gap: 14px; }
.seg { display: flex; background: rgba(246,231,200,0.06); border-radius: 999px; padding: 4px; box-shadow: 0 0 0 1px var(--line) inset; }
.seg button { flex: 1; appearance: none; border: 0; background: none; color: var(--cream-dim); font: 600 15px var(--font); padding: 9px 10px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--amber); color: var(--ink); }
.tools { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pots { display: flex; gap: 7px; justify-content: center; }
.pot {
  appearance: none; border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; position: relative;
  box-shadow: 0 0 0 2px rgba(14,11,31,0.9) inset, 0 0 0 1px var(--line); transition: transform 0.12s;
}
.pot.empty { background: repeating-conic-gradient(rgba(246,231,200,0.12) 0 25%, rgba(246,231,200,0.04) 0 50%) 50% / 12px 12px !important; }
.pot.empty::after { content: '+'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--cream-dim); font-size: 20px; }
.pot.sel { transform: scale(1.12); box-shadow: 0 0 0 2px rgba(14,11,31,0.9) inset, 0 0 0 3px var(--amber), 0 0 16px rgba(255,181,71,0.5); }
.pot.picking { animation: pickPulse 0.9s ease-in-out infinite; }
@keyframes pickPulse { 50% { box-shadow: 0 0 0 2px rgba(14,11,31,0.9) inset, 0 0 0 3px var(--cyan), 0 0 22px rgba(111,230,255,0.7); } }
.sizes { display: flex; gap: 4px; }
.sizes button { width: 38px; height: 38px; }
.sizes i { display: block; border-radius: 50%; background: currentColor; }
.tool-label { font-size: 12px; color: var(--cream-dim); text-align: center; min-height: 15px; }
.editor-actions { display: flex; gap: 8px; }
.editor-actions .btn { flex: 1; }
.edit-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 8px; }
body.wide .edit-top { right: 320px; }
.edit-top .ttl { flex: 1; text-align: center; font-weight: 600; }
.edit-top .ttl small { display: block; color: var(--cream-dim); font-weight: 500; font-size: 13px; }

/* ---------------------------------------------------------------- owl verdict */
.verdict .grade { font-size: clamp(34px, 8vw, 50px); font-weight: 700; margin: 4px 0; }
.verdict .g0 { color: var(--coral); } .verdict .g1 { color: #FF9F6C; } .verdict .g2 { color: var(--gold); } .verdict .g3 { color: var(--green); } .verdict .g4 { color: var(--cyan); text-shadow: 0 0 24px rgba(111,230,255,0.6); }
.meter { height: 10px; border-radius: 6px; background: rgba(246,231,200,0.1); overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--coral), var(--gold) 50%, var(--green)); }
.owl-hud { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: rgba(14,11,31,0.85); padding: 8px 16px 8px 10px; border-radius: 999px; box-shadow: 0 0 0 1px rgba(169,196,255,0.4) inset; font-weight: 600; white-space: nowrap; }
.owl-hud svg { width: 30px; height: 30px; }
.owl-hud .t { color: var(--moon); font-variant-numeric: tabular-nums; min-width: 52px; }

/* ---------------------------------------------------------------- share */
.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; text-align: left; }
.field label { font-size: 13px; color: var(--cream-dim); letter-spacing: 0.06em; }
.field input, .field textarea {
  appearance: none; border: 0; border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--cream);
  background: rgba(0,0,0,0.3); box-shadow: 0 0 0 1px var(--line) inset; outline: none; width: 100%;
}
.field input:focus, .field textarea:focus { box-shadow: 0 0 0 2px var(--amber) inset; }
.field textarea { resize: none; height: 92px; font-size: 13px; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; }
.choice { display: flex; gap: 6px; }
.choice button { flex: 1; }
.card-preview { width: 100%; max-width: 230px; border-radius: 14px; display: block; margin: 0 auto 14px; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,0.5); }

/* ---------------------------------------------------------------- book + settings */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs .btn { padding: 8px 16px; font-size: 15px; }

      var v = Math.round(240 * sh);
      g.fillStyle = 'rgb(' + v + ',' + Math.round(v * 0.94) + ',' + Math.round(v * 0.83) + ')';
      g.fillRect(x * k, y * k, k, k);
    }
    return (UI.icons[id] = c.toDataURL());
  };

  function pickColor(w) {
    var ed = G.edit, m = ed.m, sc = R.scene, acc = [0, 0, 0], n = 0, tmp = [0, 0, 0];
    for (var oy = -1; oy <= 1; oy++) for (var ox = -1; ox <= 1; ox++) {
      var x = PP.clamp(Math.floor(w.x) + ox, 0, PP.W - 1), y = PP.clamp(Math.floor(w.y) + oy, 0, PP.H - 1);
      var ci = m.cellAt(x + 0.5, y + 0.5);
      if (ci >= 0) m.cellColor(ci, tmp);
      else { var j = (y * PP.W + x) * 3; tmp[0] = sc.rgb[j]; tmp[1] = sc.rgb[j + 1]; tmp[2] = sc.rgb[j + 2]; }
      acc[0] += tmp[0]; acc[1] += tmp[1]; acc[2] += tmp[2]; n++;
    }
    snapshot();
    m.pal[ed.pot] = [Math.round(acc[0] / n), Math.round(acc[1] / n), Math.round(acc[2] / n)];
    ed.filled[ed.pot] = true;
    ed.picking = false;
    G.mothDirty = true;
    A.pick(ed.pot);
    R.ring(w.x, w.y, 1, 8, 0.4, PP.toHex(m.pal[ed.pot]), 2);
    G.renderEditor();
    G.saveDraft();
    if (!G.profile.tutorial.hide && G.tutorial !== 21) { G.tutorial = 21; UI.hint('Now paint on the moth. Fill more pots to match the colours around it.'); }
  }

  // ------------------------------------------------------------------ the Owl
  G.runOwl = function () {
    var ed = G.edit, sc = R.scene;
    var res = PP.owlTest(sc, ed.m, PP.hashString(PP.encodeMoth(ed.m, ed.sceneId, ed.seed)), 15, 45);
    var end = res.unfound ? res.limit : res.t;
    G.owl = { res: res, t: 0, end: end, speed: end / PP.clamp(end / 2.2, 2.2, 7), done: false, hold: 0 };
    G.state = 'owl';
    G.bodyClass('seek');
    UI.hint(null);
    R.setInsets({ top: 64, bottom: 14, left: 0, right: 0 });
    R.unzoom();
    R.outline = 0; R.brush = null; R.showHeat = false;
    R.darkTarget = 1; R.beam.on = true; R.beam.owl = true; R.beam.r = PP.OWL.R;
    if (res.path.length) { R.beam.x = res.path[0][0]; R.beam.y = res.path[0][1]; }
    A.setMode('night');
    setTimeout(A.hoot, 200);
    UI.owlHud();
  };
  function stepOwl(dt) {
    var o = G.owl;
    if (!o.done) {
      o.t = Math.min(o.end, o.t + dt * o.speed);
      var p = pathAt(o.res.path, o.t);
      R.beam.x = p.x; R.beam.y = p.y;
      UI.owlTick(o.t);
      if (o.t >= o.end) {
        o.done = true;
        var m = G.edit.m;
        if (!o.res.unfound) {
          R.ring(m.x, m.y, 6, 52, 0.8, 'rgba(169,196,255,1)', 3); R.sparks(m.x, m.y, 14, '#A9C4FF'); R.twitch(0);
          A.hoot();
        } else A.win();
      }
    } else {
      o.hold += dt;
      if (o.hold > 0.9 && G.state === 'owl') G.owlVerdict();
    }
  }
  G.owlVerdict = function () {
    var o = G.owl, ed = G.edit, p = G.profile;
    G.state = 'verdict';
    G.bodyClass('');
    R.darkTarget = 0; R.beam.on = false;
    R.setHeat(ed.m, o.res.vis.heat); R.showHeat = true;
    var score = o.res.unfound ? 999 : o.res.t;
    p.hides++;
    var prev = p.owlBest[ed.sceneId];
    if (!prev || score > prev) p.owlBest[ed.sceneId] = score;
    if (!p.tutorial.hide) p.tutorial.hide = 1;
    G.save();
    R.setInsets({ top: 20, bottom: 330, left: 0, right: 0 });
    UI.verdict(o.res, prev ? (prev >= 999 ? 'Invisible' : PP.fmtTime(prev)) : '');
    var dock = document.querySelector('.result-dock .panel');
    if (dock) R.setInsets({ top: 20, bottom: dock.offsetHeight + 16, left: 0, right: 0 });
    // close enough to read the heat map, far enough to see what you were hiding against
    R.zoomTo(2.6, ed.m.x, ed.m.y);
  };

  // ------------------------------------------------------------------ share
  G.shareLink = function (code) {
    if (PP.EMBED || !/^https?:/.test(location.protocol)) return '';
    return location.origin + location.pathname + '#m=' + code;
  };
  G.openShare = function () {
    var ed = G.edit, p = G.profile;
    ed.m.from = p.name || '';
    ed.m.limit = ed.limit;
    var code = PP.encodeMoth(ed.m, ed.sceneId, ed.seed);
    if (!G._card || G._cardKey !== code) {
      G._card = R.challengeCard(R.scene, [ed.m]).toDataURL('image/jpeg', 0.86);
      G._cardKey = code;
    }
    G.shareCode = code;
    UI.share({ code: code, link: G.shareLink(code), name: p.name || '', limit: ed.limit, card: G._card, canShare: !!navigator.share && !PP.EMBED, canDownload: !PP.EMBED });
    G.state = 'share';
  };
  function copy(text, what) {
    function ok() { UI.toast('<b>Copied</b> ' + what); }
    function fallback() {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      t.remove();
      if (done) ok(); else UI.toast('Select the text and copy it yourself');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  // ------------------------------------------------------------------ actions (buttons)
  G.action = function (a, d) {
    d = d || {};
    var p = G.profile, ed = G.edit;
    if (a !== 'input' && a !== 'setting') A.ui('click');
    switch (a) {
      case 'skipSplash': G.goTitle(); break;
      case 'title': G.goTitle(); break;
      case 'walks': G.state = 'walks'; UI.hudSet(''); R.setInsets({ top: 0, bottom: 0, left: 0, right: 0 }); G.showAttract(); UI.walks(p); A.setMode('title'); break;
      case 'startWalk': if (PP.walkUnlocked(+d.n, p)) G.startWalk(+d.n); break;
      case 'nextWalk': G.startWalk(G.pack.n + 1); break;
      case 'retry':
        if (G.pack.kind === 'walk') G.startWalk(G.pack.n);
        break;
      case 'daily': G.startDaily(); break;
      case 'nextDaily': G.beginSeek(G.daily.rounds[G.daily.results.length]); break;
      case 'light':
        if (G.state !== 'seekIntro') break;
        G.state = 'seek';
        G.round.started = true;
        R.beam.on = true;
        UI.clear();
        A.lampOn();
        if (G.tutorial === 1) {
          G.tutorial = 2;
          UI.hint(UI.touch ? 'Drag to sweep the lamp across the scene.' : 'Sweep the lamp slowly across the scene.');
          setTimeout(function () { if (G.tutorial === 2 && G.state === 'seek') UI.hint('Moths <b>shiver</b> when the light lands on them. Look for movement.'); }, 4500);
          p.tutorial.seek = 1; G.save();
        }
        break;
      case 'pause': if (G.state === 'seek') { G.paused = true; R.darkTarget = 1; UI.pause(); } break;
      case 'resume': G.paused = false; UI.clear(); G.last = performance.now(); break;
      case 'quit': G.paused = false; G.goTitle(); break;

      case 'hide':
        if (G.state === 'title' || G.state === 'share' || G.state === 'seekEnd' || G.state === 'walks') {
          G.state = 'hidePick'; UI.hudSet(''); UI.hint(null);
          R.setInsets({ top: 0, bottom: 0, left: 0, right: 0 }); G.showAttract(); A.setMode('title');
          if (!PP.sceneUnlocked(G.pick.scene, p)) G.pick.scene = 'birch';
          UI.hidePick(p, G.pick);
        }
        break;
      case 'pickScene': if (PP.sceneUnlocked(d.id, p)) { G.pick.scene = d.id; UI.hidePick(p, G.pick); } break;
      case 'pickSpecies': if (PP.speciesUnlocked(d.id, p)) { G.pick.species = d.id; UI.hidePick(p, G.pick); } break;
      case 'startHide': UI.clear(); G.startHide(G.pick.scene, G.pick.species); break;
      case 'resumeDraft': {
        var dec = p.draft && PP.decodeMoth(p.draft.code);
        if (dec) { UI.clear(); G.startHide(dec.sceneId, dec.moth.species, dec.seed, dec.moth); }
        break;
      }
      case 'editBack': G.saveDraft(); G.state = 'title'; G.action('hide'); break;
      case 'mode':
        ed.mode = d.id; ed.picking = false; R.brush = null;
        R.outline = d.id === 'move' ? 1 : 0.35;
        if (d.id === 'paint' && !p.tutorial.hide) UI.hint('Tap a pot, then tap the scene to fill it with that colour.');
        G.renderEditor();
        break;
      case 'rot': ed.m.a = (ed.m.a + (+d.n) + PP.ANGLES) % PP.ANGLES; ed.m.moved(); clampMoth(ed.m); G.mothDirty = true; G.saveDraft(); break;
      case 'setSpecies': snapshot(); ed.m.setSpecies(d.id); clampMoth(ed.m); G.mothDirty = true; G.renderEditor(); G.saveDraft(); break;
      case 'newPattern': ed.seed = (Math.random() * 4294967295) >>> 0; R.setScene(PP.makeScene(ed.sceneId, ed.seed)); G.saveDraft(); break;
      case 'pot':
        if (ed.pot === +d.n && ed.filled[ed.pot]) ed.picking = !ed.picking;
        else { ed.pot = +d.n; ed.picking = !ed.filled[ed.pot]; }
        G.renderEditor();
        break;
      case 'pipette': ed.picking = !ed.picking; G.renderEditor(); break;
      case 'size': ed.size = +d.n; G.renderEditor(); break;
      case 'speckle': ed.speckle = !ed.speckle; G.renderEditor(); break;
      case 'zoom': ed.zoom = !ed.zoom; G.applyEditZoom(); G.renderEditor(); break;
      case 'fill':
        if (!ed.filled[ed.pot]) { ed.picking = true; G.renderEditor(); break; }
        snapshot();
        var sp = ed.m.spec();
        for (var i = 0; i < sp.ncells; i++) ed.m.paint[sp.cells[i]] = ed.pot + 1;
        G.mothDirty = true; G.saveDraft();
        break;
      case 'undo': {
        var u = ed.undo.pop();
        if (!u) break;
        if (u.sp !== ed.m.species) { ed.m.species = u.sp; ed.m.moved(); clampMoth(ed.m); }
        ed.m.paint = u.paint; ed.m.pal = u.pal; ed.filled = u.filled;
        G.mothDirty = true; G.renderEditor(); G.saveDraft();
        break;
      }
      case 'owlTest':
        if (ed.m.paintedFraction() < 0.05 && !G._warnedBlank) { G._warnedBlank = true; UI.toast('A white moth? <b>Bold.</b> Tap again to test it anyway.'); break; }
        UI.clear(); G.runOwl();
        break;
      case 'skipOwl': if (G.owl && !G.owl.done) { G.owl.t = G.owl.end - 0.001; } break;
      case 'heat': R.showHeat = !R.showHeat; break;
      case 'keepPainting':
        G.state = 'edit'; R.showHeat = false; ed.mode = 'paint'; ed.zoom = true; R.outline = 0.35; A.setMode('paint'); G.renderEditor(); break;
      case 'sendMoth': R.showHeat = false; G.openShare(); break;
      case 'input':
        if (d.key === 'name') { p.name = PP.cleanName(d.value); G.save(); clearTimeout(G._shareT); G._shareT = setTimeout(G.refreshShareCode, 250); }
        break;
      case 'limit': ed.limit = +d.n; G.openShare(); break;
      case 'copyLink': copy(G.shareLink(G.shareCode), 'link'); p.daresSent++; G.save(); break;
      case 'copyCode': copy(G.shareCode, 'code'); p.daresSent++; G.save(); break;
      case 'nativeShare':
        navigator.share({ title: 'PEPPERED', text: 'I hid a moth. Bet you can\'t find it in ' + ed.limit + 's 🔦', url: G.shareLink(G.shareCode) }).catch(function () {});
        p.daresSent++; G.save();
        break;
      case 'saveCard': {
        var aEl = document.createElement('a'); aEl.href = G._card; aEl.download = 'peppered-find-the-moth.jpg';
        document.body.appendChild(aEl); aEl.click(); aEl.remove();
        break;
      }
      case 'shareDone': p.draft = null; G.save(); G.goTitle(); break;
      case 'copyShare': copy(G.shareText, 'result'); break;
      case 'code': G.state = 'code'; UI.code(false); break;
      case 'openCode': {
        var raw = (document.getElementById('codeIn') || {}).value || '', mm = /m=([A-Za-z0-9\-_]+)/.exec(raw);
        var dc = PP.decodeMoth(mm ? mm[1] : raw.trim());
        if (dc) G.openDare(dc); else UI.code(true);
        break;
      }
      case 'book': G.state = 'book'; UI.book(p, d.id); break;
      case 'settings': G.state = 'settings'; G.confirmReset = false; UI.settings(p.settings, false); break;
      case 'closeSettings': G.goTitle(); break;
      case 'setting': p.settings[d.key] = +d.value; G.applySettings(); G.save(); break;
      case 'toggle': p.settings[d.id] = p.settings[d.id] ? 0 : 1; G.applySettings(); G.save(); UI.settings(p.settings, false); break;
      case 'reset':
        if (!G.confirmReset) { G.confirmReset = true; UI.settings(p.settings, true); break; }
        var keep = p.settings;
        G.profile = PP.defaultProfile(); G.profile.settings = keep; G.save(); G.confirmReset = false;
        UI.toast('Progress reset'); G.goTitle();
        break;
    }
  };
  G.refreshShareCode = function () {
    if (G.state !== 'share') return;
    var ed = G.edit;
    ed.m.from = G.profile.name || '';
    G.shareCode = PP.encodeMoth(ed.m, ed.sceneId, ed.seed);
    var box = document.getElementById('codeBox');
    if (box) box.value = G.shareCode;
  };

  window.addEventListener('load', G.boot);
})(PP);

</script>
</body>
</html>
