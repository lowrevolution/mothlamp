<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B1F">
<title>PORCHLIGHT</title>
<meta name="description" content="Something happened at the porch light. Work out who was where. A tiny deduction game by Mothlamp, with a new case every night.">
<meta property="og:title" content="PORCHLIGHT: who nibbled the jam tart?">
<meta property="og:description" content="Six bugs, eight clues, one porch light. A new mystery every night.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%230E0B1F'/%3E%3Ccircle cx='50' cy='44' r='26' fill='%23FFB547' opacity='.35'/%3E%3Crect x='38' y='22' width='24' height='40' rx='8' fill='%23FFE2A0'/%3E%3Crect x='34' y='18' width='32' height='7' rx='3' fill='%23F6E7C8'/%3E%3Crect x='34' y='60' width='32' height='7' rx='3' fill='%23F6E7C8'/%3E%3Cellipse cx='50' cy='42' rx='5' ry='9' fill='%23fff'/%3E%3Crect x='14' y='74' width='72' height='8' rx='4' fill='%236A4A3C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PORCHLIGHT: UI layer. Mothlamp palette: midnight ink, one warm lamp, colour only where something is alive.
   New for this game: clue green for a clue that's true. */
:root {
  --ink: #0E0B1F;
  --ink-2: #16112F;
  --ink-3: #221A45;
  --line: rgba(246, 231, 200, 0.14);
  --cream: #F6E7C8;
  --cream-dim: rgba(246, 231, 200, 0.62);
  --amber: #FFB547;
  --gold: #FFE45E;
  --coral: #FF5E6C;
  --green: #7FD7A0;
  --moon: #A9C4FF;
  --font: "Fredoka", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ink); color: var(--cream);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; }
input { font-family: inherit; user-select: text; -webkit-user-select: text; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 0%, #1D1640, var(--ink) 70%); }
#bar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
  min-height: 58px;
}
#bar .ttl { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
#bar .ttl small { display: block; color: var(--cream-dim); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
#bar .ttl b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 16px; font-weight: 600; overflow: hidden; }
@media (max-width: 520px) { #bar .ttl b { font-size: 14.5px; } #bar .ttl small { font-size: 11px; } }
#bar .clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; min-width: 44px; text-align: right; color: var(--cream-dim); }
#bar .clock.target { color: var(--gold); }

#play { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#stage { position: relative; flex: none; touch-action: none; }
#stage canvas { display: block; touch-action: none; }
#clues {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
body.wide #play { flex-direction: row; }
body.wide #stage { flex: 1; }
body.wide #clues { flex: none; width: min(410px, 40vw); padding-top: 10px; border-left: 1px solid var(--line); }

/* ---------------------------------------------------------------- clues */
.clue-head { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 2px 6px; }
.clue-head h4 { margin: 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cream-dim); font-weight: 600; }
.clue-head span { font-size: 12px; color: var(--cream-dim); }
.clue-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.clue {
  display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 10px; border-radius: 14px;
  background: rgba(246, 231, 200, 0.045); box-shadow: 0 0 0 1px var(--line) inset;
  font-size: 15.5px; line-height: 1.35; cursor: pointer; transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
}
.clue:hover { background: rgba(246, 231, 200, 0.08); }
.clue .st { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: rgba(246, 231, 200, 0.07); color: var(--cream-dim); transition: 0.25s; }
.clue .tx { flex: 1; min-width: 0; }
.clue.ok { box-shadow: 0 0 0 1px rgba(127, 215, 160, 0.45) inset; }
.clue.ok .st { background: var(--green); color: var(--ink); }
.clue.bad { box-shadow: 0 0 0 1.5px rgba(255, 94, 108, 0.75) inset; background: rgba(255, 94, 108, 0.08); }
.clue.bad .st { background: var(--coral); color: var(--ink); }
.clue.hl { box-shadow: 0 0 0 2px var(--gold) inset; background: rgba(255, 228, 94, 0.08); }
.clue.done { opacity: 0.42; }
.clue.done .tx { text-decoration: line-through; text-decoration-color: rgba(246,231,200,0.5); }
.clue.rule { background: rgba(246, 231, 200, 0.025); }
.clue.rule .tag { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-dim); margin-right: 2px; }
.clue.crime { background: rgba(255, 94, 108, 0.07); box-shadow: 0 0 0 1px rgba(255, 94, 108, 0.35) inset; }
.clue.crime.ok { box-shadow: 0 0 0 1px rgba(127, 215, 160, 0.5) inset; }
.clue .x { flex: none; appearance: none; border: 0; background: none; color: var(--cream-dim); font-size: 15px; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
.clue .x:hover { background: rgba(246,231,200,0.1); color: var(--cream); }
.clue.pop { animation: cluePop 0.5s ease; }
@keyframes cluePop { 0% { transform: scale(1); } 35% { transform: scale(1.025); } 100% { transform: scale(1); } }
.clue.shake { animation: shake 0.4s ease; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.bug { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--c, var(--cream)); white-space: nowrap; }
.bug img { width: 20px; height: 20px; vertical-align: -4px; }
.bug.inline img { width: 18px; height: 18px; }

/* the bug says something: speech above the stage */
#say { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: min(440px, 92%); z-index: 2; }
#say .bubble {
  background: rgba(14, 11, 31, 0.94); padding: 10px 16px; border-radius: 16px; font-size: 15.5px; line-height: 1.35; text-align: center;
  box-shadow: 0 0 0 1px rgba(255, 181, 71, 0.45) inset, 0 10px 30px rgba(0,0,0,0.5); animation: sayIn 0.3s both;
}
#say .bubble.bad { box-shadow: 0 0 0 1px rgba(255, 94, 108, 0.6) inset, 0 10px 30px rgba(0,0,0,0.5); }
#say .bubble.good { box-shadow: 0 0 0 1px rgba(127, 215, 160, 0.6) inset, 0 10px 30px rgba(0,0,0,0.5); }
#say .bubble b { color: var(--gold); }
#say .big-say { font-size: 22px; font-weight: 700; color: var(--gold); }
@keyframes sayIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- buttons */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: 600 18px/1 var(--font); letter-spacing: 0.02em;
  color: var(--ink); background: var(--amber);
  padding: 14px 26px; border-radius: 999px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) inset, 0 8px 30px rgba(255, 181, 71, 0.28);
  transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 0 12px 40px rgba(255, 181, 71, 0.45); }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn.ghost { background: rgba(246, 231, 200, 0.06); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; }
.btn.ghost:hover { background: rgba(246, 231, 200, 0.12); }
.btn.small { font-size: 15px; padding: 10px 16px; }
.btn.tiny { font-size: 13px; padding: 8px 12px; }
.btn[disabled] { filter: grayscale(0.8) brightness(0.6); cursor: not-allowed; transform: none; }
.icon-btn {
  appearance: none; border: 0; cursor: pointer; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(14, 11, 31, 0.6); color: var(--cream); font-size: 17px;
  box-shadow: 0 0 0 1px var(--line) inset;
  display: inline-grid; place-items: center; flex: none; position: relative;
}
.icon-btn:hover { background: rgba(34, 26, 69, 0.9); }
.icon-btn.on { background: var(--amber); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .badge[hidden] { display: none; }
.icon-btn .badge { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--coral); color: var(--ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

/* ---------------------------------------------------------------- overlays */
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#ui > * { pointer-events: auto; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  animation: fadeIn 0.3s ease both;
}
.overlay.dim { background: rgba(7, 5, 16, 0.66); backdrop-filter: blur(3px); }
.overlay.scroll { align-items: flex-start; overflow-y: auto; }
.overlay.bottom { align-items: flex-end; background: linear-gradient(180deg, transparent 30%, rgba(7,5,16,0.7)); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

.panel {
  width: min(500px, 100%);
  background: linear-gradient(180deg, rgba(34, 26, 69, 0.95), rgba(14, 11, 31, 0.97));
  border-radius: 28px; padding: 24px;
  box-shadow: 0 0 0 1px var(--line) inset, 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: rise 0.4s cubic-bezier(.2, .9, .3, 1.2) both;
}
.panel h2 { margin: 0 0 6px; font-size: 28px; font-weight: 700; line-height: 1.1; }
.panel h3 { margin: 18px 0 10px; font-size: 17px; }
.panel .sub { color: var(--cream-dim); margin: 0 0 16px; font-size: 16px; line-height: 1.4; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.between { justify-content: space-between; }
.eyebrow { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cream-dim); font-weight: 600; }
.muted { color: var(--cream-dim); }
.back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

/* ---------------------------------------------------------------- title */
.title { flex-direction: column; gap: 6px; text-align: center; background: radial-gradient(ellipse at 50% 40%, rgba(14,11,31,0.35), rgba(14,11,31,0.9) 70%); }
.title .lamp { width: 84px; height: 84px; margin-bottom: 2px; animation: pop 0.9s cubic-bezier(.2, .9, .3, 1.3) both; filter: drop-shadow(0 0 30px rgba(255, 181, 71, 0.7)); }
.logo {
  font-weight: 700; font-size: clamp(46px, 11vw, 104px); line-height: 0.9; letter-spacing: 0.05em; margin: 0;
  color: var(--cream); text-shadow: 0 0 34px rgba(255, 181, 71, 0.55), 0 0 2px rgba(255, 228, 160, 0.8);
  animation: pop 0.8s cubic-bezier(.2, .9, .3, 1.3) both;
}
.logo .dot { color: var(--amber); }
.tagline { font-size: clamp(16px, 3.6vw, 21px); margin: 6px 0 20px; font-weight: 500; animation: rise 0.7s 0.2s both; max-width: 30ch; line-height: 1.3; }
.menu { display: flex; flex-direction: column; gap: 11px; align-items: center; width: min(330px, 90vw); animation: rise 0.7s 0.35s both; }
.menu .btn { width: 100%; }
.menu .btn .two { display: flex; flex-direction: column; gap: 4px; }
.menu .btn small { display: block; font-size: 12px; font-weight: 500; opacity: 0.75; letter-spacing: 0.04em; }
.menu .minor { display: flex; gap: 10px; width: 100%; }
.menu .minor .btn { flex: 1; }
.title .studio-mark { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 18px; font-size: 13px; letter-spacing: 0.3em; color: var(--cream-dim); display: flex; gap: 8px; align-items: center; }
.title .studio-mark svg { width: 22px; height: 22px; }
.title .gear { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 14px; }
.title .foot { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0; color: var(--cream-dim); font-size: 13px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 0 16px; pointer-events: none; }

/* ---------------------------------------------------------------- case cards */
.case-card { text-align: center; }
.case-card .crime { font-size: clamp(22px, 5vw, 28px); font-weight: 600; margin: 6px 0 14px; line-height: 1.2; }
.case-card .cast { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
.case-card .cast div { width: 58px; font-size: 12px; color: var(--cream-dim); }
.case-card .cast img { width: 46px; height: 46px; display: block; margin: 0 auto 2px; }
.new-bug { display: flex; gap: 14px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 16px; background: rgba(255, 181, 71, 0.08); box-shadow: 0 0 0 1px rgba(255, 181, 71, 0.4) inset; margin: 0 0 16px; }
.new-bug img { width: 64px; height: 64px; flex: none; }
.new-bug b { display: block; font-size: 18px; }
.new-bug .rule { color: var(--gold); font-weight: 600; }
.how { text-align: left; margin: 0 0 16px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.how li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.35; }
.how li i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--amber); color: var(--ink); font-style: normal; font-weight: 700; font-size: 13px; display: grid; place-items: center; margin-top: -1px; }
.target { color: var(--gold); font-weight: 600; }

/* ---------------------------------------------------------------- results */
.result { text-align: center; }
.result .who { font-size: clamp(26px, 6vw, 34px); font-weight: 700; color: var(--gold); text-shadow: 0 0 30px rgba(255, 228, 94, 0.4); margin: 4px 0; }
.result .quote { font-size: 17px; margin: 0 0 14px; font-style: italic; color: var(--cream); }
.result img.culprit { width: 76px; height: 76px; display: block; margin: 0 auto; filter: drop-shadow(0 0 18px rgba(255,181,71,0.6)); animation: pop 0.6s both; }
.stars { font-size: 32px; letter-spacing: 6px; margin: 2px 0 8px; }
.stars .on { color: var(--gold); text-shadow: 0 0 16px rgba(255, 228, 94, 0.7); }
.stars .off { color: rgba(246, 231, 200, 0.18); }
.stats-row { display: flex; justify-content: center; gap: 22px; margin: 4px 0 16px; color: var(--cream-dim); font-size: 13px; flex-wrap: wrap; }
.stats-row b { display: block; color: var(--cream); font-size: 22px; font-variant-numeric: tabular-nums; }
.share-text { white-space: pre-wrap; font-size: 14.5px; background: rgba(0,0,0,0.28); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; text-align: left; line-height: 1.45; user-select: text; -webkit-user-select: text; }
.unlock { margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; background: rgba(255, 181, 71, 0.1); box-shadow: 0 0 0 1px rgba(255, 181, 71, 0.4) inset; font-size: 15px; }
.unlock b { color: var(--gold); }
.code-field { display: flex; gap: 8px; margin: 0 0 6px; }
.code-field input { flex: 1; min-width: 0; font-size: 18px; padding: 12px 14px; border-radius: 14px; border: 0; background: rgba(0,0,0,0.3); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; letter-spacing: 0.06em; }
.err { color: var(--coral); font-size: 14px; min-height: 18px; }

/* ---------------------------------------------------------------- case files */
.nights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 4px; }
.night { appearance: none; border: 0; cursor: pointer; border-radius: 14px; padding: 10px 2px 8px; background: rgba(246,231,200,0.06); color: var(--cream);
  box-shadow: 0 0 0 1px var(--line) inset; font: 600 17px/1 var(--font); transition: 0.15s; position: relative; }
.night small { display: block; font-size: 11px; color: var(--gold); margin-top: 5px; letter-spacing: 1px; min-height: 12px; }
.night:hover { background: rgba(255, 181, 71, 0.16); transform: translateY(-2px); }
.night.locked { opacity: 0.3; cursor: not-allowed; transform: none; }
.night.next { box-shadow: 0 0 0 2px var(--amber) inset, 0 0 18px rgba(255,181,71,0.3); }
.night img { position: absolute; top: -8px; right: -6px; width: 24px; height: 24px; }
.tiers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 16px; }
.tier { appearance: none; border: 0; cursor: pointer; border-radius: 18px; padding: 14px 12px; text-align: left; background: rgba(246,231,200,0.06); color: var(--cream); box-shadow: 0 0 0 1px var(--line) inset; font: 600 18px/1.1 var(--font); transition: 0.15s; }
.tier:hover { background: rgba(255, 181, 71, 0.16); transform: translateY(-2px); }
.tier small { display: block; font-weight: 500; font-size: 13px; color: var(--cream-dim); margin-top: 6px; }
.book { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
.book .sp { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 16px; background: rgba(246,231,200,0.035); box-shadow: 0 0 0 1px var(--line) inset; }
.book .sp img { width: 52px; height: 52px; }
.book .sp b { font-size: 16px; }
.book .sp .rule { color: var(--gold); font-size: 14px; font-weight: 600; }
.book .sp .bl { color: var(--cream-dim); font-size: 14px; }
.book .sp.locked { opacity: 0.4; }
.book .sp.locked img { filter: brightness(0) opacity(0.5); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px dashed var(--line); font-size: 16px; }
.switch { appearance: none; width: 50px; height: 28px; border-radius: 14px; background: rgba(246,231,200,0.15); position: relative; cursor: pointer; border: 0; transition: 0.2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--cream); transition: 0.2s; }
.switch.on { background: var(--amber); }
.switch.on::after { left: 25px; }

@media (max-width: 400px) {
  .clue { font-size: 14.5px; padding: 8px 6px 8px 8px; gap: 8px; }
  .panel { padding: 20px 18px; }
  .nights { gap: 6px; }
}

</style>

<body>
<div id="app">
    <header id="bar"></header>
    <main id="play">
      <div id="stage"><canvas id="game" aria-label="PORCHLIGHT porch"></canvas><div id="say"></div></div>
      <aside id="clues" aria-label="Clues"></aside>
    </main>
  </div>
  <div id="ui"></div>
<script>
var PL = window.PL = window.PL || {}; PL.VERSION = "0.1.0";
// ---- src/util.js
// PORCHLIGHT: shared utilities. Loaded first; everything hangs off the PL namespace.
// Works in the browser (window.PL) and in Node (tools/*.js load these files with vm.runInThisContext).
//
// Determinism rule: a daily case or a dare link is just a seed, so every device must build the identical
// puzzle from it. Everything up to cases.js is integer logic on this RNG: no floats feed a decision
// except RNG.next(), which is exact (a 32-bit integer divided by 2^32).
var PL = (typeof window !== 'undefined') ? (window.PL = window.PL || {}) : (globalThis.PL = globalThis.PL || {});

(function (PL) {
  'use strict';

  // Seedable PRNG (mulberry32).
  function RNG(seed) { this.s = (seed >>> 0) || 1; }
  RNG.prototype.u32 = function () {
    var t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return (t ^ (t >>> 14)) >>> 0;
  };
  RNG.prototype.next = function () { return this.u32() / 4294967296; };
  RNG.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  RNG.prototype.chance = function (p) { return this.next() < p; };
  RNG.prototype.shuffle = function (arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(this.next() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;

      case 'code': UI.code(); break;
      case 'codeGo': {
        var v = (document.getElementById('codeIn') || {}).value || '';
        var m = /c=([^&\s]+)/.exec(v), d = PL.cases.decode(decodeURIComponent(m ? m[1] : v));
        if (!d) { var e = document.getElementById('codeErr'); if (e) e.textContent = 'That doesn\'t look like a PORCHLIGHT code.'; break; }
        G.openCode(d); break;
      }
      case 'start': G.begin(); break;
      case 'copyShare': if (G.lastShare) copy(G.lastShare); break;
      case 'leave':
        if (G.phase === 'reveal') break;
        if (G.cs && G.phase !== 'done') persist();
        UI.say(null);
        if (G.cs && G.cs.mode === 'night') { G.act('nights'); } else G.title();
        break;
      case 'pencil': G.st.pencil = !G.st.pencil; if (G.st.pencil) UI.say(G.st.selected >= 0 ? 'Pencil: tap tiles where ' + UI.bug(G.cs.cast[G.st.selected]) + ' can\'t be.' : 'Pencil: pick a bug, then tap the tiles where it can\'t be.', '', 2600); else UI.say(null); break;
      case 'hint': hint(); break;
      case 'cross': G.st.crossed[arg] = !G.st.crossed[arg]; UI.clueStates(G.states, G.st.crossed, G.focus); persist(); break;
      case 'focusClue': G.focus = G.focus === arg ? -1 : arg; UI.clueStates(G.states, G.st.crossed, G.focus); break;
      case 'hoverClue': G.hover = arg; break;
    }
  };
  function onKey(e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    var st = G.st;
    if (e.key === 'Escape') {
      if (G.phase === 'play' || G.phase === 'accuse') { if (st.selected >= 0) st.selected = -1; else G.act('leave'); }
      else if (UI.isOpen() && G.phase !== 'title' && G.phase !== 'done') G.act('leave');
      else if (G.phase === 'title' && UI.isOpen()) G.title();
      return;
    }
    if (G.phase !== 'play' && G.phase !== 'accuse') return;
    if (e.key === 'p' || e.key === 'P') G.act('pencil');
    else if (e.key === 'h' || e.key === 'H') G.act('hint');
    else if (/^[1-7]$/.test(e.key) && +e.key <= G.cs.n) { st.selected = st.selected === +e.key - 1 ? -1 : +e.key - 1; A.pick(); }
    else if ((e.key === 'Backspace' || e.key === 'Delete') && st.selected >= 0) unplace(st.selected);
  }

  // Which tiles a clue is about, for highlighting.
  function hlFor(it) {
    var c = it.c, b = G.cs.board, tiles = [];
    var floor = b.floor;
    switch (c.t) {
      case 'spot': tiles = b.spots[c.s].tiles; break;
      case 'light': tiles = floor.filter(function (i) { return b.tiles[i].lit === !!c.v; }); break;
      case 'obj': tiles = b.tiles.filter(function (t) { return t.obj === c.o; }).map(function (t) { return t.i; }); break;
      case 'objany': tiles = b.tiles.filter(function (t) { return t.obj; }).map(function (t) { return t.i; }); break;
      case 'edge': tiles = floor.filter(function (i) { return b.tiles[i].edge; }); break;
      case 'count':
        if (c.k === 'spot') tiles = b.spots[c.s].tiles;
        else if (c.k === 'lit') tiles = floor.filter(function (i) { return b.tiles[i].lit; });
        else if (c.k === 'crime') tiles = [G.cs.crimeTile];
        break;
    }
    return { bugs: C.involves(c), tiles: tiles };
  }

  // ---------------------------------------------------------------- input
  G.bindInput = function (canvas) {
    var down = null;
    function xy(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    canvas.addEventListener('pointerdown', function (e) {
      if (G.phase !== 'play' && G.phase !== 'accuse') return;
      var q = xy(e), h = R.hit(q.x, q.y), st = G.st, k = -1;
      if (h && h.kind === 'tile') k = st.pos.indexOf(h.i);
      else if (h && h.kind === 'tray' && h.k >= 0 && st.pos[h.k] < 0) k = h.k;
      down = { x: q.x, y: q.y, hit: h, k: k };
      if (k >= 0 && !st.locked[k] && !st.accuse) {
        st.drag = { k: k, x: q.x, y: q.y, moved: false };
        canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      }
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', function (e) {
      var st = G.st;
      if (!st || !st.drag) return;
      var q = xy(e);
      if (!st.drag.moved && Math.hypot(q.x - down.x, q.y - down.y) > 7) { st.drag.moved = true; A.pick(); st.selected = -1; }
      st.drag.x = q.x; st.drag.y = q.y;
    });
    var up = function (e) {
      var st = G.st;
      if (!st || !down) return;
      var q = xy(e), d = st.drag;
      st.drag = null;
      if (d && d.moved) {
        var h = R.hit(q.x, q.y);
        if (h && h.kind === 'tile') place(d.k, h.i);
        else if (h && h.kind === 'tray') unplace(d.k);
        down = null; return;
      }
      tap(down.hit, down.k);
      down = null;
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', function () { if (G.st) G.st.drag = null; down = null; });
  };
  function tap(h, k) {
    var st = G.st, b = G.cs.board;
    if (!h) { st.selected = -1; return; }
    if (st.accuse) { if (k >= 0) accuse(k); return; }
    if (k >= 0) {
      // tapping a bug: select it (tapping the selected one in the tray again deselects)
      if (h.kind === 'tray' || st.selected !== k) { st.selected = st.selected === k ? -1 : k; A.pick(); if (st.pencil && st.selected >= 0) UI.say('Pencil: tap tiles where ' + UI.bug(G.cs.cast[k]) + ' can\'t be.', '', 2200); }
      else st.selected = -1;
      return;
    }
    if (h.kind === 'tray') {
      // a placed bug's empty slot: tap to send it back if selected, else select it
      if (h.k >= 0 && st.pos[h.k] >= 0) { if (st.selected === h.k) { unplace(h.k); st.selected = -1; } else { st.selected = h.k; A.pick(); } }
      else st.selected = -1;
      return;
    }
    if (h.kind === 'tile') {
      if (b.tiles[h.i].spot < 0) return;
      if (st.selected < 0) { UI.say('Pick a bug from the tray first.', '', 1600); return; }
      if (st.pencil) { toggleMark(st.selected, h.i); return; }
      if (place(st.selected, h.i)) st.selected = -1;
    }
  }

  // ---------------------------------------------------------------- frame
  var barT = 0;
  G.tick = function (dt, now) {
    if (G.phase === 'title' && G.demo) {
      var dm = G.demo;
      dm.t += dt;
      if (dm.t > 0.9) {
        dm.t = 0;
        if (dm.step < dm.cs.n) { dm.pos[dm.step] = dm.cs.solution[dm.step]; dm.step++; }
        else if (dm.step++ > dm.cs.n + 3) { newDemo(); }
      }
      R.draw({ pos: dm.pos, selected: -1, time: now, marks: null, hl: null });
      return;
    }
    if (!G.cs || !G.st) return;
    var st = G.st;
    if ((G.phase === 'play' || G.phase === 'accuse') && !document.hidden && !UI.isOpen()) st.time += dt;
    if (st.reveal) st.reveal.t += dt;
    barT -= dt;
    if (barT <= 0) {
      barT = 0.25;
      UI.barState({ time: st.time, clock: G.p.settings.clock, target: G.target, pencil: st.pencil, hints: st.hints });
    }
    var fi = G.hover >= 0 ? G.hover : G.focus;
    st.hl = fi >= 0 && G.items[fi] ? hlFor(G.items[fi]) : null;
    st.time2 = now;
    R.draw({ pos: st.pos, selected: st.selected, drag: st.drag, marks: st.marks, hl: st.hl, locked: st.locked,
      wrongBug: st.wrongBug, accuse: st.accuse, reveal: st.reveal, time: now });
  };

  if (typeof window !== 'undefined') {
    var go = function () { G.boot(); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  }
})(PL);

</script>
</body>
</html>
